<html lang="en">
<head>

</head>

<body class="driver-desktop-page" data-page="history">
  <div class="driver-shell">
    <aside class="driver-sidebar">
      <div class="ds-brand-logo" data-href="dashboard.html" data-size="sm" data-sub="Driver Portal"></div>

      <nav class="sidebar-nav">
        <a class="nav-link" data-nav="dashboard" href="dashboard.html">
          <span class="nav-icon icon-dashboard"></span>
          <span>Dashboard</span>
        </a>

        <a class="nav-link" data-nav="map" href="map.html">
          <span class="nav-icon icon-map"></span>
          <span>Map</span>
        </a>

        <a class="nav-link active" data-nav="history" href="history.html">
          <span class="nav-icon icon-history"></span>
          <span>History</span>
        </a>

        <a class="nav-link" data-nav="notifications" href="notifications.html">
          <span class="nav-icon icon-notifications"></span>
          <span>Notifications</span>
        </a>

        <a class="nav-link" data-nav="earnings" href="earnings.html">
          <span class="nav-icon icon-earnings"></span>

        </a>

    <main class="driver-main">
      <header class="topbar">

          <p>Completed orders and issue reports</p>
        </div>

        <div class="topbar-right">
          <div style="position:relative">
           <a class="icon-circle" href="notifications.html" aria-label="Notifications">
  <svg
    width="21"
    height="21"
    viewBox="0 0 24 24"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
    aria-hidden="true"
  >
    <path
      d="M18 9C18 5.686 15.314 3 12 3C8.686 3 6 5.686 6 9V13.2C6 14.054 5.728 14.885 5.224 15.574L4 17.25H20L18.776 15.574C18.272 14.885 18 14.054 18 13.2V9Z"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M9.5 20C10.1 20.62 11 21 12 21C13 21 13.9 20.62 14.5 20"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
    />
  </svg>

  <span class="icon-badge"></span>
</a>
          </div>

          <div class="profile-menu" style="position:relative">
            <a class="profile-chip" type="button">
              <div class="profile-avatar" data-current-user-avatar></div>
              <div>
                <div style="font-weight:800" data-current-user-name></div>
                <div style="font-size:12px;color:#9e9e9e" data-current-user-email></div>
              </div>
            </a>
          </div>
        </div>
      </header>

      <section class="content">
       

        <div class="history-grid">
          <div class="history-card">
            <div class="card-head">
              <div>
                <h2>Order History</h2>
                <p>Completed and delivered trips</p>
              </div>
              <span id="completedCount" class="count-pill">0</span>
            </div>

            <input id="orderHistorySearch" placeholder="Search by trip ID, customer, address..." style="width:100%;margin-bottom:14px;padding:10px 14px;border-radius:12px;border:1px solid #262626;background:#0b0b0b;color:#fff;font:inherit">

            <div id="orderHistoryList" class="timeline-list">
              <div class="empty-state">Loading order history...</div>
            </div>

            <div id="orderHistoryMeta" style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px"></div>
          </div>

          <div class="history-card">
            <div class="card-head">
              <div>
                <h2>Issue Reports</h2>
                <p>Issues reported by the driver</p>
              </div>
              <a class="small-btn" href="report-issue.html">New Issue</a>
            </div>

            <div id="issueReportsList" class="issue-list">
              <div class="empty-state">Loading issue reports...</div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <style>
    body {
      font-family: Inter, sans-serif;
    }

    .verify-box {
      margin-bottom: 20px;
      padding: 12px 16px;
      border-radius: 12px;
      background: #111827;
      border: 1px solid #1f2937;
      color: #d1d5db;
      font-size: 14px;
    }

    .history-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .history-card {
      background: linear-gradient(135deg, #1f1f1f, #111);
      border: 1px solid #262626;
      border-radius: 20px;
      padding: 22px;
      color: #fff;
      box-shadow: 0 18px 40px rgba(0,0,0,.25);
      min-height: 260px;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 18px;
    }

    .card-head h2 {
      margin: 0;
      font-size: 24px;
      font-weight: 900;
    }

    .card-head p {
      margin: 6px 0 0;
      color: #9ca3af;
      font-size: 13px;
    }

    .count-pill,
    .small-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: #ffd400;
      color: #000;
      font-weight: 900;
      padding: 8px 14px;
      text-decoration: none;
      border: none;
      white-space: nowrap;
    }

    .timeline-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .timeline-item{
  position:relative;
  display:block;
  padding:16px 16px 16px 42px;
  background:#0b0b0b;
  border:1px solid #262626;
  border-radius:16px;
  min-height:110px;
}

.timeline-dot{
  position:absolute;
  left:16px;
  top:20px;
  width:14px;
  height:14px;
  border-radius:999px;
  background:#ffd400;
  box-shadow:0 0 0 4px rgba(255,212,0,.12);
}

.timeline-title{
  margin:0 0 6px;
  font-size:16px;
  font-weight:900;
  line-height:1.35;
}

.timeline-meta{
  color:#9ca3af;
  font-size:13px;
  line-height:1.6;
}

.timeline-time{
  margin-top:10px;
  color:#ffd400;
  font-size:12px;
  font-weight:900;
  line-height:1.4;
}

    .issue-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .issue-card {
      background: #0b0b0b;
      border: 1px solid #262626;
      border-radius: 16px;
      padding: 16px;
    }

    .issue-top {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .issue-title {
      font-weight: 900;
      font-size: 16px;
    }

    .issue-id {
      background: rgba(255, 212, 0, .15);
      color: #ffd400;
      border: 1px solid rgba(255, 212, 0, .35);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .issue-desc {
      color: #d1d5db;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .issue-meta {
      color: #9ca3af;
      font-size: 12px;
    }

    .issue-actions {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .danger-btn {
      border: 1px solid #ef4444;
      background: rgba(239, 68, 68, .12);
      color: #fecaca;
      padding: 9px 14px;
      border-radius: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .view-btn {
      border: 1px solid #262626;
      background: #111;
      color: #fff;
      padding: 9px 14px;
      border-radius: 12px;
      font-weight: 900;
      text-decoration: none;
    }

    .empty-state {
      background: #0b0b0b;
      border: 1px dashed #333;
      border-radius: 16px;
      padding: 22px;
      color: #9ca3af;
      text-align: center;
      font-weight: 700;
    }

    @media (max-width: 1000px) {
      .history-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const ROLE = "driver";


      const TOKEN = (JSON.parse(localStorage.getItem("deliverysync-session-v1") || "null") || {}).token || "";
      const session = JSON.parse(localStorage.getItem("deliverysync-session-v1") || "null");
      let sessionUser = null;
      try {
        if (session && session.userId && window.DeliverySyncAPI && window.DeliverySyncAPI.Users) {
          sessionUser = await window.DeliverySyncAPI.Users.getById(session.userId);
        }
      } catch (e) {
        console.error("Failed to resolve current driver from backend:", e);
      }
      const DRIVER_NAME = sessionUser?.name || session?.name || "";

      

      const getArray = (result) => {
        if (Array.isArray(result)) return result;
        if (Array.isArray(result?.data)) return result.data;
        if (Array.isArray(result?.items)) return result.items;
        if (Array.isArray(result?.trips)) return result.trips;
        if (Array.isArray(result?.deliveries)) return result.deliveries;
        return [];
      };

      const formatDateTime = (value) => {
        if (!value) return "Recently";

        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;

        return date.toLocaleString("en-IN", {
          day: "2-digit",
          month: "short",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      };

      const fetchTrips = async () => {
        if (window.DeliverySyncAPI?.Trips?.getAll) {
          return getArray(await DeliverySyncAPI.Trips.getAll());
        }

        const res = await fetch("http://localhost:3000/api/trips", {
          headers: { "Authorization": "Bearer " + TOKEN },
        });

        if (!res.ok) {
          throw new Error(`Trips fetch failed with status ${res.status}`);
        }

        return getArray(await res.json());
      };

      const fetchDeliveries = async () => {
        if (window.DeliverySyncAPI?.Deliveries?.getAll) {
          return getArray(await DeliverySyncAPI.Deliveries.getAll());
        }

        const res = await fetch("http://localhost:3000/api/deliveries", {
          headers: { "Authorization": "Bearer " + TOKEN },
        });

        if (!res.ok) {
          throw new Error(`Deliveries fetch failed with status ${res.status}`);
        }

        return getArray(await res.json());
      };

      const normalize = (value) => String(value || "").trim().toLowerCase();

      const getDeliveryForTrip = (trip, deliveries) => {
        const requestId = trip.request || trip.deliveryId || trip.deliveryRequestId;

        return (
          deliveries.find((d) => String(d.id) === String(requestId)) ||
          deliveries.find((d) => String(d.deliveryId) === String(requestId)) ||
          null
        );
      };

      let orderHistoryPage = 1;
      const orderHistoryPageSize = 8;

      const renderOrderHistory = (trips, deliveries) => {
        const list = document.getElementById("orderHistoryList");

        const completedTrips = trips.filter((trip) => {
          const status = normalize(trip.status);
          const driver = normalize(trip.driver);

          return (
            driver.includes(normalize(DRIVER_NAME)) &&
            ["completed", "delivered"].includes(status)
          );
        });

        document.getElementById("completedCount").textContent = completedTrips.length;

        const rows = completedTrips.map((trip) => {
          const delivery = getDeliveryForTrip(trip, deliveries);

          const requestId = trip.request || trip.deliveryId || trip.deliveryRequestId || "N/A";
          const customer =
            trip.customer ||
            trip.client ||
            delivery?.customer ||
            delivery?.client ||
            "Customer not available";

          const pickup = trip.pickup || delivery?.pickup || "Pickup not available";
          const drop =
            trip.destination ||
            trip.dropoff ||
            delivery?.dropoff ||
            delivery?.destination ||
            "Drop not available";

          const status = trip.status || delivery?.status || "Completed";
          const time = trip.completedAt || trip.updatedAt || trip.issueReportedAt || trip.createdAt || "Recently";

          return { trip, requestId, customer, pickup, drop, status, time };
        });

        const q = (document.getElementById("orderHistorySearch").value || "").trim().toLowerCase();
        const filtered = q
          ? rows.filter((r) => JSON.stringify(r).toLowerCase().includes(q))
          : rows;

        const totalPages = Math.max(1, Math.ceil(filtered.length / orderHistoryPageSize));
        if (orderHistoryPage > totalPages) orderHistoryPage = totalPages;
        const pageRows = filtered.slice((orderHistoryPage - 1) * orderHistoryPageSize, orderHistoryPage * orderHistoryPageSize);

        if (!pageRows.length) {
          list.innerHTML = `<div class="empty-state">${q ? "No orders match your search." : "No completed orders found."}</div>`;
          document.getElementById("orderHistoryMeta").innerHTML = "";
          return;
        }

        list.innerHTML = pageRows.map((r) => `
            <div class="timeline-item">
              <div class="timeline-dot"></div>
              <div class="timeline-title">Order ${r.status}</div>
              <div class="timeline-meta">
                <strong>${r.trip.id}</strong> → ${r.requestId}<br>
                ${r.customer}<br>
                ${r.pickup} → ${r.drop}
              </div>
              <div class="timeline-time">${formatDateTime(r.time)}</div>
            </div>
          `).join("");

        document.getElementById("orderHistoryMeta").innerHTML = `
          <span style="color:#9ca3af;font-size:12px">Showing ${pageRows.length} of ${filtered.length}</span>
          <div style="display:flex;gap:8px">
            <button id="orderHistoryPrev" ${orderHistoryPage <= 1 ? "disabled" : ""} style="padding:6px 12px;border-radius:8px;border:1px solid #262626;background:#111;color:#fff;cursor:pointer">Prev</button>
            <span style="color:#9ca3af;font-size:12px;align-self:center">Page ${orderHistoryPage} of ${totalPages}</span>
            <button id="orderHistoryNext" ${orderHistoryPage >= totalPages ? "disabled" : ""} style="padding:6px 12px;border-radius:8px;border:1px solid #262626;background:#111;color:#fff;cursor:pointer">Next</button>
          </div>
        `;

        const prevBtn = document.getElementById("orderHistoryPrev");
        const nextBtn = document.getElementById("orderHistoryNext");
        if (prevBtn) prevBtn.onclick = () => { if (orderHistoryPage > 1) { orderHistoryPage--; renderOrderHistory(trips, deliveries); } };
        if (nextBtn) nextBtn.onclick = () => { if (orderHistoryPage < totalPages) { orderHistoryPage++; renderOrderHistory(trips, deliveries); } };
      };

      const renderIssueReports = (trips, deliveries) => {
        const list = document.getElementById("issueReportsList");

        const issueTrips = trips.filter((trip) => {
          const driver = normalize(trip.driver);
          const status = normalize(trip.status);

          return (
            driver.includes(normalize(DRIVER_NAME)) &&
            (
              status.includes("issue") ||
              trip.issueType ||
              trip.issueDescription
            )
          );
        });

        if (!issueTrips.length) {
          list.innerHTML = `<div class="empty-state">No issue reports found.</div>`;
          return;
        }

        list.innerHTML = issueTrips.map((trip) => {
          const delivery = getDeliveryForTrip(trip, deliveries);

          const requestId = trip.request || trip.deliveryId || trip.deliveryRequestId || "N/A";
          const issueType = trip.issueType || delivery?.issueType || "Issue Reported";
          const description =
            trip.issueDescription ||
            delivery?.issueDescription ||
            "No issue description available.";

          const reportedAt =
            trip.issueReportedAt ||
            delivery?.issueReportedAt ||
            trip.updatedAt ||
            "Recently";

          return `
            <div class="issue-card">
              <div class="issue-top">
                <div>
                  <div class="issue-title">${issueType}</div>
                  <div class="issue-meta">${trip.id} → ${requestId}</div>
                </div>
                <div class="issue-id">${requestId}</div>
              </div>

              <div class="issue-desc">${description}</div>

              <div class="issue-meta">
                ${formatDateTime(reportedAt)} • ${trip.status || "Issue Reported"}
              </div>

              <div class="issue-actions">
                <a class="view-btn" href="task-details.html?id=${encodeURIComponent(trip.id)}">View</a>
              </div>
            </div>
          `;
        }).join("");
      };

      const loadHistory = async () => {
        try {
          const trips = await fetchTrips();
          const deliveries = await fetchDeliveries();

          renderOrderHistory(trips, deliveries);
          renderIssueReports(trips, deliveries);

          document.getElementById("orderHistorySearch").oninput = () => {
            orderHistoryPage = 1;
            renderOrderHistory(trips, deliveries);
          };

          console.log("HISTORY TRIPS:", trips);
          console.log("HISTORY DELIVERIES:", deliveries);

          console.table({
            historyPageLoaded: true,
            tripsLoadedFromBackend: trips.length,
            deliveriesLoadedFromBackend: deliveries.length,
            completedForDriver: trips.filter(
              (t) =>
                normalize(t.driver).includes(normalize(DRIVER_NAME)) &&
                ["completed", "delivered"].includes(normalize(t.status))
            ).length,
            issuesForDriver: trips.filter(
              (t) =>
                normalize(t.driver).includes(normalize(DRIVER_NAME)) &&
                (normalize(t.status).includes("issue") || t.issueType || t.issueDescription)
            ).length,
            source: "GET /api/trips + GET /api/deliveries",
          });

          
        } catch (error) {
          console.error("History backend sync failed:", error);
          console.error(`History backend sync failed: ${error.message}`);
        }
      };

      document.getElementById("driverLogout").addEventListener("click", () => {
        window.location.href = "../login.html";
      });

      await loadHistory();
    });
  </script>
</body>
</html>
