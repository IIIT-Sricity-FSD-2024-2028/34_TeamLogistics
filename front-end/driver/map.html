<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Driver Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/brand-logo.css">
  <link rel="stylesheet" href="../assets/css/driver-desktop.css"><script src="../assets/js/api-client.js"></script><script src="../assets/js/driver-common.js"></script><script src="../assets/js/brand-logo.js"></script>
  <script src="../assets/js/current-user.js" defer></script>
</head>
<body class="driver-desktop-page" data-page="map">
  <div class="driver-shell">
    <aside class="driver-sidebar">
      <div class="ds-brand-logo" data-href="dashboard.html" data-size="sm" data-sub="Driver Portal"></div>
      <nav class="sidebar-nav">
        <a class="nav-link" data-nav="dashboard" href="dashboard.html"><span class="nav-icon icon-dashboard"></span><span>Dashboard</span></a>
        <a class="nav-link active" data-nav="map" href="map.html"><span class="nav-icon icon-map"></span><span>Map</span></a>
        <a class="nav-link" data-nav="history" href="history.html"><span class="nav-icon icon-history"></span><span>History</span></a>
        <a class="nav-link" data-nav="notifications" href="notifications.html"><span class="nav-icon icon-notifications"></span><span>Notifications</span></a>
        <a class="nav-link" data-nav="earnings" href="earnings.html"><span class="nav-icon icon-earnings"></span><span>Earnings</span></a>
        <a class="nav-link" data-nav="profile" href="profile.html"><span class="nav-icon icon-profile"></span><span>Profile</span></a>
      </nav>
      <div class="sidebar-footer">
<button class="logout-btn" id="driverLogout" type="button" style="margin-top:10px"><span>Logout</span></button>
      </div>
    </aside>
    <main class="driver-main">
      <header class="topbar">
        <div class="topbar-left"><h1 id="page-title">Driver Portal</h1><p id="page-subtitle">Desktop view</p></div>
        <div class="topbar-right">
          <div id="notifWrap" style="position:relative"><a class="icon-circle" href="notifications.html" aria-label="Notifications">
  <svg
    width="21"
    height="21"
    viewBox="0 0 24 24"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
    aria-hidden="true"
  >
    <path
      d="M18 9C18 5.686 15.314 3 12 3C8.686 3 6 5.686 6 9V13.2C6 14.054 5.728 14.885 5.224 15.574L4 17.25H20L18.776 15.574C18.272 14.885 18 14.054 18 13.2V9Z"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M9.5 20C10.1 20.62 11 21 12 21C13 21 13.9 20.62 14.5 20"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
    />
  </svg>

  <span class="icon-badge"></span>
</a><div class="dropdown" id="notifMenu"></div></div>
          <div id="profileWrap" class="profile-menu" style="position:relative"><a class="profile-chip" id="profileBtn" type="button"><div class="profile-avatar" id="profileInitial" data-current-user-avatar></div><div><div id="quickProfileName" style="font-weight:800" data-current-user-name></div><div id="quickProfileEmail" style="font-size:12px;color:#9e9e9e" data-current-user-email></div></div></a><div class="dropdown" id="profileMenu"><div class="dropdown-item"><strong>Driver Quick Actions</strong><small><a href="profile.html">Edit profile</a></small><small><a href="dashboard.html">View dashboard</a></small></div></div></div>
        </div>
      </header>
      <section class="content" id="driver-content">Loading trip...</section>
    </main>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const session = JSON.parse(localStorage.getItem("deliverysync-session-v1") || "null");
      const content = document.getElementById("driver-content");
      let tripId = new URLSearchParams(window.location.search).get("id");

      const rupee = (n) => new Intl.NumberFormat("en-IN", { style: "currency", currency: "INR", maximumFractionDigits: 2 }).format(n || 0);

      const esc = (value) => String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");

      const ACTIVE_STATUSES = ["accepted", "picked up", "in transit", "issue reported"];

      async function findActiveTripId() {
        if (!window.DeliverySyncAPI?.Trips?.getAll) return null;

        try {
          const trips = await DeliverySyncAPI.Trips.getAll();
          const active = (trips || []).find((t) => ACTIVE_STATUSES.includes(String(t.status || "").toLowerCase()));
          return active ? active.id : null;
        } catch (e) {
          console.error("Failed to look up active trip for map:", e);
          return null;
        }
      }

      if (!tripId) {
        tripId = await findActiveTripId();
      }

      if (!tripId) {
        content.innerHTML = `<div style="padding:24px;background:#171717;border:1px solid #262626;border-radius:16px;color:#9ca3af;text-align:center">You have no active delivery right now. Accept a delivery from the Dashboard to see it here.</div>`;
        return;
      }

      const STATUS_STEPS = ["accepted", "picked up", "in transit", "delivered"];

      function statusIndex(status) {
        const s = String(status || "").toLowerCase();
        if (s === "completed") return 3;
        return STATUS_STEPS.indexOf(s);
      }

      async function updateTripStatus(id, status) {
        const TOKEN = (session || {}).token || "";
        const response = await fetch(`http://localhost:3000/api/trips/${encodeURIComponent(id)}/status`, {
          method: "PATCH",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + TOKEN,
          },
          body: JSON.stringify({ status }),
        });

        if (!response.ok) {
          throw new Error(`Trip status update failed with status ${response.status}`);
        }

        return response.json();
      }

      async function loadAndRenderTrip() {
        const trip = window.DeliverySyncAPI?.Trips?.getOne
          ? await DeliverySyncAPI.Trips.getOne(tripId)
          : null;

        if (!trip) throw new Error("Trip not found");

        const NOT_YET_ACCEPTED_STATUSES = ["queued", "assigned", "pending", "delayed"];
        if (NOT_YET_ACCEPTED_STATUSES.includes(String(trip.status || "").toLowerCase())) {
          content.innerHTML = `<div style="padding:24px;background:#171717;border:1px solid #262626;border-radius:16px;color:#9ca3af;text-align:center">This delivery (${esc(trip.status || "Queued")}) hasn't been accepted yet. Go to the Dashboard to accept it first.</div>`;
          return;
        }

        let delivery = null;
        try {
          const requestId = trip.request || trip.deliveryId || trip.deliveryRequestId;
          if (requestId && window.DeliverySyncAPI?.Deliveries?.getOne) {
            delivery = await DeliverySyncAPI.Deliveries.getOne(requestId);
          }
        } catch (e) {}

        const pickup = trip.pickup || trip.pickupLocation || delivery?.pickup || "Pickup not available";
        const drop = trip.destination || trip.dropoff || trip.dropLocation || delivery?.dropoff || delivery?.destination || "Destination not available";
        const distance = trip.distance || delivery?.distance || "Distance not available";
        const eta = trip.eta || trip.estimatedTime || delivery?.eta || "Not available";
        const status = trip.status || delivery?.status || "Assigned";
        const amount = trip.amount || delivery?.amount || delivery?.pricing?.total || 0;
        const customer =
          trip.customer || trip.client || trip.customerName || trip.clientName ||
          delivery?.customer || delivery?.client || delivery?.customerName || delivery?.clientName ||
          delivery?.company || delivery?.businessName || delivery?.name || "Customer not available";
        const isIssueReported = String(status).toLowerCase() === "issue reported";
        const idx = isIssueReported ? statusIndex(trip.statusBeforeIssue) : statusIndex(status);

        const stepHtml = ["Accepted", "Picked Up", "In Transit", "Delivered"].map((label, i) => `
          <div class="step ${idx >= i ? "done" : ""}">
            <div class="step-bubble">${i + 1}</div>
            <div class="step-label">${label}</div>
          </div>
        `).join("");

        let actionHtml = "";

        if (isIssueReported) {
          const resumeStatus = trip.statusBeforeIssue || "In Transit";
          actionHtml = `
            <div class="package-light-card" style="margin-top:16px;border:1px solid #ef4444">
              <div class="meta-label" style="color:#ff8c8c">Issue Reported</div>
              <div class="meta-value">${esc(trip.issueType || "Issue")}: ${esc(trip.issueDescription || "No description")}</div>
            </div>
            <button id="advanceBtn" class="btn yellow full" type="button" data-next="${esc(resumeStatus)}" style="margin-top:14px">Resume Delivery</button>
          `;
        } else if (idx === 0) {
          actionHtml = `<button id="advanceBtn" class="btn yellow full" type="button" data-next="Picked Up" style="margin-top:14px">Mark as Picked Up</button>`;
        } else if (idx === 1) {
          actionHtml = `<button id="advanceBtn" class="btn yellow full" type="button" data-next="In Transit" style="margin-top:14px">Mark as In Transit</button>`;
        } else if (idx === 2) {
          actionHtml = `<a class="btn yellow full" style="margin-top:14px" href="proof-of-delivery.html?id=${encodeURIComponent(trip.id || tripId)}">Continue to Proof of Delivery</a>`;
        } else if (idx === 3) {
          actionHtml = `<div class="package-light-card" style="margin-top:16px;text-align:center;color:var(--yellow);font-weight:800">✓ Delivery completed</div>`;
        }

        content.innerHTML = `
          <div class="map-layout">
            <div class="map-card">
              <div class="map-surface">
                <div class="map-road road-a"></div>
                <div class="map-road road-b"></div>
                <div class="map-road road-c"></div>
                <div class="map-road road-d"></div>
                <div class="map-park park-a"></div>
                <div class="map-park park-b"></div>
                <div class="map-water water-a"></div>
                <div class="map-water water-b"></div>
                <div class="map-road-tag">Live Route</div>
              </div>
              <div class="fake-map-grid"></div>
              <div class="map-path"></div>
              <div class="map-chip">${esc(distance)} • ${esc(eta)}</div>
              <div class="map-pin pick"></div>
              <div class="map-pin current"></div>
              <div class="map-pin drop"></div>
              <div class="mini-stat">
                <div class="card"><div class="meta-label">Amount</div><div class="metric-value" style="font-size:28px">${rupee(amount)}</div></div>
                <div class="card"><div class="meta-label">Status</div><div class="metric-value" style="font-size:22px">${esc(status)}</div></div>
              </div>
            </div>

            <div class="card">
              <h2 style="margin-top:0">Delivery Progress</h2>

              ${idx >= 0 ? `<div class="progress-steps">${stepHtml}</div>` : ""}

              <div class="package-light-card">
                <div class="meta-label">Customer</div>
                <div class="meta-value">${esc(customer)}</div>

                <div class="meta-label" style="margin-top:12px">Current Route</div>
                <div class="meta-value">${esc(pickup)} → ${esc(drop)}</div>

                <div class="meta-label" style="margin-top:12px">Trip Status</div>
                <div class="meta-value" style="color:var(--yellow)">${esc(status)}</div>

                <div class="meta-label" style="margin-top:12px">Delivery Request</div>
                <div class="meta-value">${esc(trip.request || trip.deliveryId || trip.id || tripId)}</div>
              </div>

              <div class="actions-3" style="margin-top:16px">
                <a class="btn dark" href="task-details.html?id=${encodeURIComponent(trip.id || tripId)}">Open Details</a>
                <a class="btn dark" href="notifications.html">Notifications</a>
                <a class="btn dark" href="report-issue.html?id=${encodeURIComponent(trip.id || tripId)}&action=issue">Report Issue</a>
              </div>

              ${actionHtml}
            </div>
          </div>
        `;

        const advanceBtn = document.getElementById("advanceBtn");
        if (advanceBtn) {
          advanceBtn.addEventListener("click", async () => {
            const nextStatus = advanceBtn.dataset.next;

            try {
              advanceBtn.disabled = true;
              advanceBtn.textContent = "Updating...";

              await updateTripStatus(trip.id || tripId, nextStatus);
              await loadAndRenderTrip();
            } catch (error) {
              console.error("Failed to update trip status:", error);
              advanceBtn.disabled = false;
              advanceBtn.textContent = "Try again";
            }
          });
        }
      }

      try {
        await loadAndRenderTrip();
      } catch (error) {
        console.error("Failed to load trip for map view:", error);
        content.innerHTML = `<div style="padding:24px;background:#171717;border:1px solid #262626;border-radius:16px;color:#9ca3af;text-align:center">Unable to load this trip. It may no longer exist.</div>`;
      }
    });
  </script>
</body>
</html>
