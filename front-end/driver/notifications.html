<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>Notifications | DeliverSync</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="../assets/css/brand-logo.css">
  <link rel="stylesheet" href="../assets/css/driver-desktop.css">

  <script src="../assets/js/api-client.js"></script>
  <script src="../assets/js/brand-logo.js"></script>
  <script src="../assets/js/current-user.js" defer></script>
</head>

<body class="driver-desktop-page" data-page="notifications">

  <div class="driver-shell">



    <aside class="driver-sidebar">

      <div class="ds-brand-logo"
           data-href="dashboard.html"
           data-size="sm"
           data-sub="Driver Portal">
      </div>

      <nav class="sidebar-nav">

        <a
          class="nav-link"
          data-nav="dashboard"
          href="dashboard.html"
        >
          <span class="nav-icon icon-dashboard"></span>
          <span>Dashboard</span>
        </a>

        <a
          class="nav-link"
          data-nav="map"
          href="map.html"
        >
          <span class="nav-icon icon-map"></span>
          <span>Map</span>
        </a>

        <a
          class="nav-link"
          data-nav="history"
          href="history.html"
        >
          <span class="nav-icon icon-history"></span>
          <span>History</span>
        </a>

        <a
          class="nav-link active"
          data-nav="notifications"
          href="notifications.html"
        >
          <span class="nav-icon icon-notifications"></span>
          <span>Notifications</span>
        </a>

        <a
          class="nav-link"
          data-nav="earnings"
          href="earnings.html"
        >
          <span class="nav-icon icon-earnings"></span>
          <span>Earnings</span>
        </a>

        <a
          class="nav-link"
          data-nav="profile"
          href="profile.html"
        >
          <span class="nav-icon icon-profile"></span>
          <span>Profile</span>
        </a>

      </nav>

      <div class="sidebar-footer">

        <button
          class="logout-btn"
          id="driverLogout"
          type="button"
        >
          <span>Logout</span>
        </button>

      </div>

    </aside>



    <main class="driver-main">



      <header class="topbar">

        <div class="topbar-left">

          <h1>
            Notifications
          </h1>

          <p>
            Updates from trips, deliveries, issues, and system actions
          </p>

        </div>

        <div class="topbar-right">



          <a
            class="icon-circle notification-link"
            id="notifBtn"
            href="notifications.html"
            aria-label="Notifications"
          >

            <svg
              width="21"
              height="21"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M18 9C18 5.686 15.314 3 12 3C8.686 3 6 5.686 6 9V13.2C6 14.054 5.728 14.885 5.224 15.574L4 17.25H20L18.776 15.574C18.272 14.885 18 14.054 18 13.2V9Z"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />

              <path
                d="M9.5 20C10.1 20.62 11 21 12 21C13 21 13.9 20.62 14.5 20"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>

            <span
              class="icon-badge"
              id="topUnreadBadge"
            ></span>

          </a>



          <a
            class="profile-chip"
            href="profile.html"
          >

            <div class="profile-avatar" data-current-user-avatar></div>

            <div>

              <div
                style="
                  font-weight:800;
                  color:#fff;
                "
               data-current-user-name></div>

              <div
                style="
                  font-size:12px;
                  color:#9e9e9e;
                "
                data-current-user-email
              ></div>

            </div>

          </a>

        </div>

      </header>



      <section class="content">

        <div class="notifications-page">

          <div class="notifications-card">



            <div class="notif-header">

              <div>

                <h2>
                  Notifications
                </h2>

                <p>
                  Updates from trips, deliveries, issues, and system actions
                </p>

              </div>

              <div class="notif-actions">

                <span
                  id="unreadCount"
                  class="count-pill"
                >
                  0 New
                </span>

                <button
                  id="markReadBtn"
                  class="yellow-btn"
                  type="button"
                >
                  Mark all as read
                </button>

              </div>

            </div>



            <div class="tabs">

              <button
                class="tab active"
                data-filter="all"
                type="button"
              >
                All Notifications
              </button>

              <button
                class="tab"
                data-filter="unread"
                type="button"
              >
                Unread
              </button>

              <button
                class="tab"
                data-filter="read"
                type="button"
              >
                Read
              </button>

            </div>



            <div
              id="notificationsList"
              class="notifications-list"
            >
              <div class="empty-state">
                Loading notifications...
              </div>
            </div>

          </div>

        </div>

      </section>

    </main>

  </div>



  <style>

    .notifications-page{
      width:100%;
      max-width:1100px;
      margin:0 auto;
    }

    .notifications-card{
      width:100%;
      background:
        linear-gradient(
          135deg,
          #1f1f1f,
          #111
        );
      border:1px solid #262626;
      border-radius:20px;
      padding:26px;
      color:#fff;
      box-shadow:0 18px 40px rgba(0,0,0,.24);
      box-sizing:border-box;
    }

    .notif-header{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:24px;
      margin-bottom:22px;
    }

    .notif-header h2{
      margin:0;
      font-size:28px;
      font-weight:900;
      letter-spacing:-.02em;
    }

    .notif-header p{
      margin:7px 0 0;
      color:#9ca3af;
      font-size:14px;
      line-height:1.5;
    }

    .notif-actions{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:12px;
      flex-wrap:wrap;
    }

    .count-pill{
      min-height:42px;
      padding:0 16px;
      border-radius:999px;
      background:#ffd400;
      color:#111;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size:14px;
      font-weight:900;
      white-space:nowrap;
      box-sizing:border-box;
    }

    .yellow-btn{
      min-height:42px;
      padding:0 18px;
      border:none;
      border-radius:12px;
      background:#ffd400;
      color:#111;
      font-family:Inter,sans-serif;
      font-size:14px;
      font-weight:800;
      cursor:pointer;
      transition:.2s ease;
    }

    .yellow-btn:hover{
      background:#ffe047;
    }

    .yellow-btn:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    .tabs{
      display:flex;
      align-items:center;
      gap:28px;
      border-bottom:1px solid #292929;
      margin-bottom:22px;
    }

    .tab{
      position:relative;
      background:transparent;
      border:none;
      color:#9ca3af;
      padding:13px 0;
      font-family:Inter,sans-serif;
      font-size:14px;
      font-weight:800;
      cursor:pointer;
    }

    .tab.active{
      color:#ffd400;
    }

    .tab.active::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      bottom:-1px;
      height:2px;
      background:#ffd400;
    }

    .notifications-list{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .notification-item{
      display:grid;
      grid-template-columns:48px minmax(0,1fr) 10px;
      gap:16px;
      align-items:start;

      background:#0b0b0b;
      border:1px solid #292929;
      border-radius:16px;
      padding:18px;
      box-sizing:border-box;
      transition:.2s ease;
    }

    .notification-item:hover{
      border-color:#3a3a3a;
      transform:translateY(-1px);
    }

    .notification-item.unread{
      border-color:rgba(255,212,0,.42);
      background:
        linear-gradient(
          135deg,
          rgba(255,212,0,.08),
          #0b0b0b
        );
    }

    .notif-icon{
      width:46px;
      height:46px;
      border-radius:14px;

      background:#050505;
      border:1px solid #292929;

      display:flex;
      align-items:center;
      justify-content:center;

      color:#ffd400;
      font-size:18px;
      font-weight:900;
    }

    .notif-title{
      margin-bottom:6px;
      color:#fff;
      font-size:16px;
      font-weight:900;
      line-height:1.3;
    }

    .notif-message{
      margin-bottom:9px;
      color:#d1d5db;
      font-size:14px;
      line-height:1.55;
    }

    .notif-meta{
      color:#8f8f8f;
      font-size:12px;
      font-weight:600;
    }

    .unread-dot{
      width:9px;
      height:9px;
      border-radius:50%;
      background:#ffd400;
      margin-top:9px;
    }

    .empty-state{
      background:#0b0b0b;
      border:1px dashed #333;
      border-radius:16px;
      padding:30px;
      color:#9ca3af;
      text-align:center;
      font-size:14px;
      font-weight:700;
    }

    .notification-link{
      text-decoration:none;
    }

    .notification-actions{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:10px;
      margin-top:4px;
    }

    .delete-notification{
      width:34px;
      height:34px;
      display:flex;
      align-items:center;
      justify-content:center;
      border:1px solid #343434;
      border-radius:10px;
      background:#111;
      color:#9ca3af;
      cursor:pointer;
      transition:.2s ease;
      flex-shrink:0;
    }

    .delete-notification svg{
      width:17px;
      height:17px;
      fill:none;
      stroke:currentColor;
      stroke-width:1.8;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .delete-notification:hover{
      color:#ff6b6b;
      border-color:#ff4444;
      background:rgba(255,68,68,.08);
    }

    .delete-notification:disabled{
      opacity:.5;
      cursor:not-allowed;
    }

    @media (max-width:850px){

      .notif-header{
        flex-direction:column;
        align-items:flex-start;
      }

      .notif-actions{
        justify-content:flex-start;
      }

    }

    @media (max-width:650px){

      .notifications-page{
        max-width:none;
      }

      .notifications-card{
        padding:18px;
      }

      .notification-item{
        grid-template-columns:42px minmax(0,1fr);
        gap:12px;
        padding:15px;
      }

      .notification-actions{
        grid-column:2;
        justify-content:flex-start;
        margin-top:2px;
      }

      .notif-icon{
        width:42px;
        height:42px;
      }

      .notif-title{
        font-size:15px;
      }

      .notif-message{
        font-size:13px;
      }

    }

  </style>



  <script>

    document.addEventListener(
      "DOMContentLoaded",
      async () => {

        const ROLE = "driver";

        let notifications = [];
        let currentFilter = "all";

        const getArray = (result) => {

          if (Array.isArray(result)) {
            return result;
          }

          if (Array.isArray(result?.data)) {
            return result.data;
          }

          if (Array.isArray(result?.items)) {
            return result.items;
          }

          if (Array.isArray(result?.notifications)) {
            return result.notifications;
          }

          return [];

        };

        const escapeHtml = (value) => {

          return String(value ?? "")
            .replaceAll("&","&amp;")
            .replaceAll("<","&lt;")
            .replaceAll(">","&gt;")
            .replaceAll('"',"&quot;")
            .replaceAll("'","&#039;");

        };

        const formatTime = (value) => {

          if (!value) {
            return "Just now";
          }

          const date =
            new Date(value);

          if (
            Number.isNaN(
              date.getTime()
            )
          ) {
            return String(value);
          }

          return date.toLocaleString(
            "en-IN",
            {
              day:"2-digit",
              month:"short",
              year:"numeric",
              hour:"2-digit",
              minute:"2-digit"
            }
          );

        };

        const fetchNotifications =
          async () => {

            const response =
              await fetch(
                "http://localhost:3000/api/notifications",
                {
                  headers:{
                    "x-user-role":ROLE
                  }
                }
              );

            if (!response.ok) {
              throw new Error(
                `Notifications fetch failed with status ${response.status}`
              );
            }

            return getArray(
              await response.json()
            );

          };

        const markAllRead =
          async () => {

            const response =
              await fetch(
                "http://localhost:3000/api/notifications/mark-read",
                {
                  method:"PATCH",

                  headers:{
                    "Content-Type":
                      "application/json",

                    "x-user-role":
                      ROLE
                  }
                }
              );

            if (!response.ok) {
              throw new Error(
                `Mark read failed with status ${response.status}`
              );
            }

            return response.json();

          };

        const getIcon =
          (title,message) => {

            const text =
              `${title || ""} ${message || ""}`
                .toLowerCase();

            if (
              text.includes("issue") ||
              text.includes("problem") ||
              text.includes("blocked")
            ) {
              return "!";
            }

            if (
              text.includes("completed") ||
              text.includes("delivered")
            ) {
              return "✓";
            }

            if (
              text.includes("accepted") ||
              text.includes("confirmed")
            ) {
              return "✓";
            }

            if (
              text.includes("assigned") ||
              text.includes("reassigned")
            ) {
              return "⇄";
            }

            if (
              text.includes("payment") ||
              text.includes("earning")
            ) {
              return "₹";
            }

            if (
              text.includes("trip")
            ) {
              return "→";
            }

            return "•";

          };

        const updateUnreadCount =
          () => {

            const unread =
              notifications.filter(
                (n) => !n.read
              ).length;

            document
              .getElementById("unreadCount")
              .textContent =
              `${unread} New`;

            const topBadge =
              document.getElementById(
                "topUnreadBadge"
              );

            if (topBadge) {

              topBadge.textContent =
                unread > 0
                  ? unread
                  : "";

              topBadge.style.display =
                unread > 0
                  ? "inline-flex"
                  : "none";

            }

          };

        const renderNotifications =
          () => {

            const list =
              document.getElementById(
                "notificationsList"
              );

            let filtered =
              [...notifications];

            if (
              currentFilter === "unread"
            ) {

              filtered =
                filtered.filter(
                  (n) => !n.read
                );

            }

            if (
              currentFilter === "read"
            ) {

              filtered =
                filtered.filter(
                  (n) => n.read
                );

            }

            if (!filtered.length) {

              list.innerHTML = `
                <div class="empty-state">
                  No ${escapeHtml(
                    currentFilter
                  )} notifications found.
                </div>
              `;

              updateUnreadCount();

              return;
            }

            list.innerHTML =
              filtered
                .map((n) => {

                  const title =
                    n.title ||
                    "Notification";

                  const message =
                    n.message ||
                    "No message available.";

                  const time =
                    n.time ||
                    formatTime(
                      n.createdAt
                    );

                  const read =
                    Boolean(n.read);

                  const recipient =
                    n.to ||
                    "driver";

                  return `
                    <div
                      class="
                        notification-item
                        ${read ? "" : "unread"}
                      "
                    >

                      <div class="notif-icon">
                        ${escapeHtml(
                          getIcon(
                            title,
                            message
                          )
                        )}
                      </div>

                      <div>

                        <div class="notif-title">
                          ${escapeHtml(title)}
                        </div>

                        <div class="notif-message">
                          ${escapeHtml(message)}
                        </div>

                        <div class="notif-meta">
                          ${escapeHtml(time)}
                          &nbsp;•&nbsp;
                          ${read ? "Read" : "Unread"}
                          &nbsp;•&nbsp;
                          To: ${escapeHtml(recipient)}
                        </div>

                      </div>

                      <div class="notification-actions">

                        ${
                          read
                            ? ""
                            : `
                              <div
                                class="unread-dot"
                                title="Unread"
                              ></div>
                            `
                        }

                        <button
                          type="button"
                          class="delete-notification"
                          data-delete-notification="${escapeHtml(
                            n.id || n.notificationId || ""
                          )}"
                          title="Delete notification"
                          aria-label="Delete notification"
                        >
                          <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M3 6h18"></path>
                            <path d="M8 6V4h8v2"></path>
                            <path d="M19 6l-1 15H6L5 6"></path>
                            <path d="M10 11v6"></path>
                            <path d="M14 11v6"></path>
                          </svg>
                        </button>

                      </div>

                    </div>
                  `;

                })
                .join("");

            updateUnreadCount();

          };

        const deleteNotification =
          async (id) => {

            if (!id) {
              throw new Error(
                "Notification ID is missing."
              );
            }

            const response =
              await fetch(
                `http://localhost:3000/api/notifications/${encodeURIComponent(id)}`,
                {
                  method:"DELETE",
                  headers:{
                    "x-user-role":ROLE
                  }
                }
              );

            if (!response.ok) {
              throw new Error(
                `Delete failed with status ${response.status}`
              );
            }

            const contentType =
              response.headers.get("content-type") || "";

            if (contentType.includes("application/json")) {
              return response.json();
            }

            return null;

          };

        const loadNotifications =
          async () => {

            try {

              notifications =
                await fetchNotifications();

              renderNotifications();

              console.log(
                "DRIVER NOTIFICATIONS:",
                notifications
              );

              console.table({

                notificationsPageLoaded:
                  true,

                notificationsLoadedFromBackend:
                  notifications.length,

                unread:
                  notifications.filter(
                    (n) => !n.read
                  ).length,

                source:
                  "GET /api/notifications with x-user-role: driver"

              });

            } catch (error) {

              console.error(
                "Notifications backend sync failed:",
                error
              );

              document
                .getElementById(
                  "notificationsList"
                )
                .innerHTML = `
                  <div class="empty-state">
                    Could not load notifications from backend.
                  </div>
                `;

            }

          };

        document
          .querySelectorAll(".tab")
          .forEach((tab) => {

            tab.addEventListener(
              "click",
              () => {

                document
                  .querySelectorAll(".tab")
                  .forEach(
                    (item) =>
                      item.classList.remove(
                        "active"
                      )
                  );

                tab.classList.add(
                  "active"
                );

                currentFilter =
                  tab.dataset.filter ||
                  "all";

                renderNotifications();

              }
            );

          });

        document
          .getElementById("markReadBtn")
          .addEventListener(
            "click",
            async () => {

              const btn =
                document.getElementById(
                  "markReadBtn"
                );

              try {

                btn.disabled = true;

                btn.textContent =
                  "Updating...";

                await markAllRead();

                notifications =
                  await fetchNotifications();

                renderNotifications();

                console.table({

                  markAllReadSuccessful:
                    true,

                  unreadAfterUpdate:
                    notifications.filter(
                      (n) => !n.read
                    ).length,

                  source:
                    "PATCH /api/notifications/mark-read"

                });

              } catch (error) {

                console.error(
                  "Mark all read failed:",
                  error
                );

              } finally {

                btn.disabled = false;

                btn.textContent =
                  "Mark all as read";

              }

            }
          );

        document
          .getElementById("driverLogout")
          .addEventListener(
            "click",
            () => {

              window.location.href =
                "../login.html";

            }
          );

        document
          .getElementById("notificationsList")
          .addEventListener(
            "click",
            async (event) => {

              const button =
                event.target.closest(
                  "[data-delete-notification]"
                );

              if (!button) {
                return;
              }

              const id =
                button.getAttribute(
                  "data-delete-notification"
                );

              if (!id) {
                console.error(
                  "Cannot delete notification: missing ID."
                );
                return;
              }

              const confirmed =
                window.confirm(
                  "Delete this notification?"
                );

              if (!confirmed) {
                return;
              }

              try {

                button.disabled = true;

                await deleteNotification(id);

                notifications =
                  notifications.filter(
                    (notification) => {

                      const notificationId =
                        notification.id ||
                        notification.notificationId;

                      return String(notificationId) !== String(id);

                    }
                  );

                renderNotifications();

                console.log(
                  "Notification deleted:",
                  id
                );

              } catch (error) {

                console.error(
                  "Delete notification failed:",
                  error
                );

                button.disabled = false;

                alert(
                  "Unable to delete this notification. Please try again."
                );

              }

            }
          );

        await loadNotifications();

      }
    );

  </script>

</body>
</html>
