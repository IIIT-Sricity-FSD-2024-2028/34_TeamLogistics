<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Driver Login</title>
  <link rel="stylesheet" href="../assets/css/driver-mobile.css">
<link rel="stylesheet" href="../assets/css/brand-logo.css">
<script src="../assets/js/workflow-demo.js" defer></script><script src="../assets/js/api-client.js"></script><script src="../assets/js/brand-logo.js"></script>
</head>
<body class="driver-login-page">
  <div class="login-wrap">
    <div class="logo" style="color:#fff;margin-bottom:28px">
      <div class="logo-badge">🚚</div>
      <div class="logo-text"><span class="ds-deliver">Deliver</span><span class="ds-sync">Sync</span></div>
    </div>
    <div class="login-card">
      <h1 class="page-title" style="margin-top:0">Welcome Back!!</h1>
      <label class="form-label">Email</label>
      <input id="driverEmail" class="login-input" placeholder="abc@gmail.com">
      <div class="login-muted">Email or username is required</div>
      <label class="form-label" style="margin-top:20px">Password</label>
      <input id="driverPassword" class="login-input" type="password" placeholder="••••••••">
      <div class="login-muted">Password is required</div>
      <div class="row-between mt-20">
        <div style="display:flex;align-items:center;gap:8px;color:#666666"><input id="rememberMe" type="checkbox" checked> Remember Me</div>
        <a class="white-link" href="#">Forgot Password?</a>
      </div>
      <button id="driverLoginBtn" class="btn gray full mt-24" style="max-width:160px;margin-left:auto;margin-right:auto">Login</button>
      <div id="driverLoginError" class="login-muted" style="color:#ff8080;display:none"></div>
      <div class="center mt-24" style="color:#666666">Don't have an account? <a class="white-link" href="register.html">Get started</a></div>
    </div>
  </div>
  <script>
    (function () {
      const existing = JSON.parse(localStorage.getItem('deliverysync-session-v1') || 'null');
      if (existing && existing.userId && existing.role === 'driver') {
        window.location.replace('dashboard.html');
        return;
      }

      const errorBox = document.getElementById('driverLoginError');

      document.getElementById('driverLoginBtn').addEventListener('click', async function (e) {
        e.preventDefault();
        errorBox.style.display = 'none';

        const email = document.getElementById('driverEmail').value.trim();
        const password = document.getElementById('driverPassword').value;
        const remember = document.getElementById('rememberMe').checked;

        if (!window.DeliverySyncAPI || !window.DeliverySyncAPI.Auth) {
          errorBox.textContent = 'DeliverySyncAPI is not loaded.';
          errorBox.style.display = 'block';
          return;
        }

        try {
          const user = await window.DeliverySyncAPI.Auth.login(email, password);

          if (user.role !== 'driver') {
            errorBox.textContent = 'This account is not a Driver account.';
            errorBox.style.display = 'block';
            return;
          }

          localStorage.setItem('deliverysync-session-v1', JSON.stringify({
            userId: user.userId,
            name: user.name,
            email: user.email,
            role: user.role,
            remembered: remember,
            loggedInAt: new Date().toISOString(),
          }));

          window.location.replace('dashboard.html');
        } catch (error) {
          errorBox.textContent = error.message || 'Login failed. Please try again.';
          errorBox.style.display = 'block';
        }
      });
    })();
  </script>
</body>
</html>
