<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Business Client | DeliverSync</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/brand-logo.css">
  <script src="assets/js/data.js"></script>
  <script src="assets/js/api-client.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/forms.js" defer></script>
  <script src="assets/js/brand-logo.js"></script>
</head>

<body>
  <main class="auth-shell">
    <section class="showcase" style="display:none;"></section>
    <section class="auth-panel-wrap" style="grid-column:1 / -1;">
      <div class="auth-panel dark" style="width:min(760px,100%);">
        <a class="back-link" href="roles.html">← Back</a>
        <div class="page-header-logo"><div class="ds-brand-logo" data-href="index.html" data-size="lg"></div></div>
        <div class="auth-card-head">
          <div class="icon-box" style="margin:0;">▣</div>
          <div>
            <h3>Create Your Business Client Account</h3>
            <p>Register for enterprise-level deliveries</p>
          </div>
        </div>
        <form id="business-form" novalidate>
          <div class="form-grid">
            <div class="form-control"><label for="companyName">Company Name <span
                  style="color:#9ca3af;font-size:12px">(Optional)</span></label><input id="companyName"
                name="companyName" type="text" placeholder="Enter company name">
              <div class="error-message"></div>
            </div>
            <div class="form-control"><label for="fullName">Full Name</label><input id="fullName" name="fullName"
                type="text" placeholder="Enter full name">
              <div class="error-message"></div>
            </div>
            <div class="form-control"><label for="companyContact">Company Contact Number <span
                  style="color:#9ca3af;font-size:12px">(Optional)</span></label><input id="companyContact"
                name="companyContact" type="text" placeholder="Enter company number">
              <div class="error-message"></div>
            </div>
            <div class="form-control"><label for="businessAddress">Address</label><input id="businessAddress"
                name="businessAddress" type="text" placeholder="Enter address">
              <div class="error-message"></div>
            </div>
            <div class="form-control"><label for="personalMobile">Personal Mobile Number</label><input
                id="personalMobile" name="personalMobile" type="text" placeholder="Enter mobile">
              <div class="error-message"></div>
            </div>
            <div class="form-control"><label for="email">Email Address</label><input id="email" name="email"
                type="email" placeholder="Enter email">
              <div class="error-message"></div>
            </div>
            <div class="form-row">
              <div class="form-control"><label for="password">Password</label>
                <div class="input-wrap"><input id="password" name="password" type="password"
                    placeholder="Minimum 8 chars, 1 capital, 1 number, 1 special"><button type="button"
                    class="toggle-visibility">👁</button></div>
                <div class="error-message"></div>
              </div>
              <div class="form-control"><label for="confirmPassword">Confirm Password</label>
                <div class="input-wrap"><input id="confirmPassword" name="confirmPassword" type="password"
                    placeholder="Confirm password"><button type="button" class="toggle-visibility">👁</button></div>
                <div class="error-message"></div>
              </div>
            </div>
            <div class="form-control"><label class="checkbox-line" style="align-items:flex-start;"><input id="terms"
                  name="terms" type="checkbox" value="yes"> I agree to the <span class="text-link">Terms and
                  Conditions</span> and <span class="text-link">Privacy Policy</span>. I understand that my business
                information will be used for delivery services.</label>
              <div class="error-message"></div>
            </div>
          </div>
          <div class="form-actions" style="justify-content:stretch;"><button class="btn btn-primary" style="width:100%;"
              type="submit">Create Account</button></div>
          <div class="form-footer">Already have an account? <a href="login.html">Sign in</a></div>
        </form>
      </div>
    </section>
  </main>
</body>

</html>
