<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <script src="../assets/js/brand-logo.js"></script>
  <script src="../assets/js/current-user.js" defer></script>
</head>

<body class="bc-body" data-page="completed-deliveries">

        </a>

        <a href="notifications.html">

      <a class="bc-logout" href="../login.html">
        <span class="ico">↢</span>

    <main class="bc-main">
      <header class="bc-topbar">

  <div class="bc-topbar-left">
    <div class="company" data-current-user-name="company">Loading...</div>
    <div class="subtitle">Business Client Dashboard</div>
  </div>

  <div class="bc-top-actions">

    <a
      class="bc-bell"
      href="notifications.html"
      aria-label="Notifications"
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <path
          d="M18 9C18 5.686 15.314 3 12 3C8.686 3 6 5.686 6 9V13.2C6 14.054 5.728 14.885 5.224 15.574L4 17.25H20L18.776 15.574C18.272 14.885 18 14.054 18 13.2V9Z"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M9.5 20C10.1 20.62 11 21 12 21C13 21 13.9 20.62 14.5 20"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>

      <span class="badge">3</span>
    </a>

    <a class="bc-profile-chip" href="profile.html">

      <div class="bc-profile-avatar" data-current-user-avatar></div>

      <div class="bc-profile-info">
        <strong data-current-user-name></strong>

</header>

      <section class="bc-content">
        <a href="completed-deliveries.html" class="back-link">Back</a>

        <h1 class="page-title">Provide Feedback</h1>
        <p class="page-subtitle">Rate your completed delivery experience</p>

       

        <div class="feedback-card">
          <form id="feedbackForm">
            <div class="form-grid">
              <div>
                <label>Delivery ID</label>
                <input id="deliveryIdInput" type="text" readonly />
              </div>

              <div>
                <label>Trip ID</label>
                <input id="tripIdInput" type="text" readonly />
              </div>

              <div>
                <label>Driver</label>
                <input id="driverInput" type="text" readonly />
              </div>

              <div>
                <label>Status</label>
                <input id="statusInput" type="text" readonly />
              </div>
            </div>

            <div class="summary-box">
              <div>
                <span>From</span>
                <strong id="pickupText">--</strong>
              </div>

              <div>
                <span>To</span>
                <strong id="dropoffText">--</strong>
              </div>

              <div>
                <span>Package</span>
                <strong id="packageText">--</strong>
              </div>
            </div>

            <label>Overall Rating</label>
            <div class="stars" id="stars">
              <button type="button" data-rating="1">★</button>
              <button type="button" data-rating="2">★</button>
              <button type="button" data-rating="3">★</button>
              <button type="button" data-rating="4">★</button>
              <button type="button" data-rating="5">★</button>
            </div>

            <label>Share Your Experience</label>
            <textarea
              id="commentInput"
              placeholder="Tell us what went well and what can be improved"
            ></textarea>

            <div class="form-grid">
              <div>
                <label>Delivery Quality</label>
                <select id="deliveryQualityInput">
                  <option value="">Select quality</option>
                  <option value="Excellent">Excellent</option>
                  <option value="Good">Good</option>
                  <option value="Average">Average</option>
                  <option value="Poor">Poor</option>
                </select>
              </div>

              <div>
                <label>Driver Behavior</label>
                <select id="driverBehaviorInput">
                  <option value="">Select behavior</option>
                  <option value="Excellent">Excellent</option>
                  <option value="Good">Good</option>
                  <option value="Average">Average</option>
                  <option value="Poor">Poor</option>
                </select>
              </div>
            </div>

            <label>Overall Experience</label>
            <select id="overallExperienceInput">
              <option value="">Select experience</option>
              <option value="Very satisfied">Very satisfied</option>
              <option value="Satisfied">Satisfied</option>
              <option value="Neutral">Neutral</option>
              <option value="Unsatisfied">Unsatisfied</option>
            </select>

            <div id="formMessage"></div>

            <div class="actions">
              <button id="submitBtn" type="submit" class="yellow-btn">
                Submit Feedback
              </button>

              <a href="completed-deliveries.html" class="dark-btn">
                Cancel
              </a>
            </div>
          </form>
        </div>
      </section>
    </main>
  </div>

  <style>
    body {
      font-family: Inter, sans-serif;
    }

    .back-link {
      display: inline-block;
      color: #9ca3af;
      text-decoration: none;
      font-size: 16px;
      margin-bottom: 18px;
    }

    .verify-box {
      margin: 18px 0;
      padding: 12px 16px;
      border-radius: 12px;
      background: #111827;
      border: 1px solid #1f2937;
      color: #d1d5db;
      font-size: 14px;
    }

    .feedback-card {
      max-width: 980px;
      background: linear-gradient(135deg, #1f1f1f, #111);
      border: 1px solid #262626;
      border-radius: 22px;
      padding: 28px;
      color: #fff;
      box-shadow: 0 18px 40px rgba(0,0,0,.25);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      color: #9fb0c9;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-size: 13px;
    }

    input,
    textarea,
    select {
      width: 100%;
      box-sizing: border-box;
      background: #050505;
      border: 1px solid #1f2937;
      color: #fff;
      border-radius: 14px;
      padding: 15px 16px;
      font-family: Inter, sans-serif;
      font-weight: 700;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #ffd400;
      box-shadow: 0 0 0 3px rgba(255, 212, 0, .15);
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    input[readonly] {
      opacity: .85;
      cursor: not-allowed;
    }

    .summary-box {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .summary-box div {
      background: #080808;
      border: 1px solid #262626;
      border-radius: 16px;
      padding: 16px;
    }

    .summary-box span {
      display: block;
      color: #9ca3af;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 6px;
    }

    .summary-box strong {
      display: block;
      font-size: 15px;
    }

    .stars {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
    }

    .stars button {
      background: transparent;
      border: none;
      font-size: 34px;
      cursor: pointer;
      color: #4b5563;
      transition: transform .15s ease, color .15s ease;
    }

    .stars button.active {
      color: #ffd400;
    }

    .stars button:hover {
      transform: scale(1.08);
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .yellow-btn,
    .dark-btn {
      border: none;
      border-radius: 14px;
      padding: 14px 20px;
      font-weight: 900;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: Inter, sans-serif;
    }

    .yellow-btn {
      background: #ffd400;
      color: #000;
    }

    .yellow-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .dark-btn {
      background: #0b0b0b;
      color: #fff;
      border: 1px solid #262626;
    }

    #formMessage {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
    }

    #formMessage.success {
      display: block;
      background: rgba(16, 185, 129, .12);
      border: 1px solid #10b981;
      color: #d1fae5;
    }

    #formMessage.error {
      display: block;
      background: rgba(239, 68, 68, .12);
      border: 1px solid #ef4444;
      color: #fecaca;
    }

    @media (max-width: 800px) {
      .form-grid,
      .summary-box {
        grid-template-columns: 1fr;
      }
    }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const ROLE = "business-client";


      const TOKEN = (JSON.parse(localStorage.getItem("deliverysync-session-v1") || "null") || {}).token || "";
      const params = new URLSearchParams(window.location.search);
      const deliveryId = params.get("id");

      let delivery = null;
      let trip = null;
      let rating = 4;

      

      const setMessage = (message, type) => {
        const box = document.getElementById("formMessage");
        box.textContent = message;
        box.className = type;
      };

      const getArray = (result) => {
        if (Array.isArray(result)) return result;
        if (Array.isArray(result?.data)) return result.data;
        if (Array.isArray(result?.items)) return result.items;
        if (Array.isArray(result?.trips)) return result.trips;
        return [];
      };

      const fetchDelivery = async (id) => {
        const response = await fetch(`http://localhost:3000/api/deliveries/${encodeURIComponent(id)}`, {
          headers: {
            "Authorization": "Bearer " + TOKEN,
          },
        });

        if (!response.ok) {
          throw new Error(`Delivery fetch failed with status ${response.status}`);
        }

        return response.json();
      };

      const fetchTrips = async () => {
        const response = await fetch("http://localhost:3000/api/trips", {
          headers: {
            "Authorization": "Bearer " + TOKEN,
          },
        });

        if (!response.ok) {
          throw new Error(`Trips fetch failed with status ${response.status}`);
        }

        return getArray(await response.json());
      };

      const submitFeedback = async (id, payload) => {
        const response = await fetch(`http://localhost:3000/api/deliveries/${encodeURIComponent(id)}/feedback`, {
          method: "PATCH",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + TOKEN,
          },
          body: JSON.stringify(payload),
        });

        if (!response.ok) {
          const body = await response.json().catch(() => ({}));
          throw new Error(body.message || `Feedback submit failed with status ${response.status}`);
        }

        return response.json();
      };

      const getPickup = (d) => {
        return d.pickup || d.from || d.pickupAddress || d.source || "--";
      };

      const getDropoff = (d) => {
        return d.dropoff || d.destination || d.to || d.dropAddress || "--";
      };

      const renderStars = () => {
        document.querySelectorAll("#stars button").forEach((btn) => {
          const value = Number(btn.dataset.rating);
          btn.classList.toggle("active", value <= rating);
        });
      };

      const loadPage = async () => {
        if (!deliveryId) {
  setMessage(
    "Missing delivery ID. Please open feedback from a completed delivery.",
    "error"
  );
  return;
}

        delivery = await fetchDelivery(deliveryId);

        const trips = await fetchTrips();
        trip = trips.find((t) => String(t.request) === String(deliveryId)) || null;

        document.getElementById("deliveryIdInput").value = delivery.id || deliveryId;
        document.getElementById("tripIdInput").value = trip?.id || "--";
        document.getElementById("driverInput").value =
          trip?.driver ||
          delivery.driver ||
          delivery.assignedDriver ||
          "Not assigned";
        document.getElementById("statusInput").value =
          delivery.status ||
          trip?.status ||
          "--";

        document.getElementById("pickupText").textContent = getPickup(delivery);
        document.getElementById("dropoffText").textContent = getDropoff(delivery);
        // ── Show structured package info when available ──
        const pkgType = delivery.packageType || '';
        const pkgDims = delivery.packageDimensions;
        let packageDisplay = '--';
        if (pkgType && pkgDims && pkgDims.length) {
          packageDisplay = pkgType + ' — ' + pkgDims.length + ' × ' + pkgDims.width + ' × ' + pkgDims.height + ' ' + (pkgDims.unit || 'cm');
        } else if (pkgType) {
          packageDisplay = pkgType;
        } else {
          packageDisplay = delivery.package || delivery.item || '--';
        }
        document.getElementById("packageText").textContent = packageDisplay;

        if (delivery.feedback) {
          rating = Number(delivery.feedback.rating || 4);
          document.getElementById("commentInput").value = delivery.feedback.comment || "";
          document.getElementById("deliveryQualityInput").value = delivery.feedback.deliveryQuality || "";
          document.getElementById("driverBehaviorInput").value = delivery.feedback.driverBehavior || "";
          document.getElementById("overallExperienceInput").value = delivery.feedback.overallExperience || "";
        }

        renderStars();

        console.log("FEEDBACK DELIVERY:", delivery);
        console.log("FEEDBACK TRIP:", trip);

        console.table({
          feedbackPageLoaded: true,
          deliveryId: delivery.id,
          tripId: trip?.id || "No linked trip",
          driver: trip?.driver || delivery.driver || "Not assigned",
          status: delivery.status,
          source: "GET /api/deliveries/:id + GET /api/trips",
        });

        
      };

      document.querySelectorAll("#stars button").forEach((btn) => {
        btn.addEventListener("click", () => {
          rating = Number(btn.dataset.rating);
          renderStars();
        });
      });

      document.getElementById("feedbackForm").addEventListener("submit", async (event) => {
  event.preventDefault();

  if (!delivery) {
    setMessage("Delivery is not loaded yet.", "error");
    return;
  }

  const payload = {
    rating,
    comment: document.getElementById("commentInput").value.trim(),
    deliveryQuality: document.getElementById("deliveryQualityInput").value,
    driverBehavior: document.getElementById("driverBehaviorInput").value,
    overallExperience: document.getElementById("overallExperienceInput").value
  };

  const submitBtn = document.getElementById("submitBtn");

  try {
    submitBtn.disabled = true;
    submitBtn.textContent = "Submitting...";

    const updatedDelivery = await submitFeedback(
  delivery.id,
  payload
);

console.log("FEEDBACK SUBMIT RESPONSE:", updatedDelivery);

setMessage(
  "Feedback submitted successfully. Redirecting...",
  "success"
);

window.location.assign(
  new URL("completed-deliveries.html", window.location.href).href
);

return;

  } catch (error) {
    console.error("Feedback submit failed:", error);

    setMessage(
      `Feedback submit failed: ${error.message}`,
      "error"
    );

    submitBtn.disabled = false;
    submitBtn.textContent = "Submit Feedback";
  }
});

      try {
        await loadPage();
      } catch (error) {
        console.error("Feedback page load failed:", error);
        setMessage(
  `Could not load feedback data: ${error.message}`,
  "error"
);
      }
    });
  </script>
</body>
</html>
