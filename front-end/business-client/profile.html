    <main class="bc-main">
      <header class="bc-topbar">
        <div>
          <div class="company" id="topCompanyName" data-current-user-name="company"></div>
          <div class="subtitle">Business Client Dashboard</div>
        </div>

        <a class="bc-bell" href="notifications.html" aria-label="Notifications">
          <svg viewBox="0 0 24 24">
            <path d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 1 0-12 0v3.2a2 2 0 0 1-.6 1.4L4 17h5"></path>

          </svg>
          <span class="badge">3</span>
        </a>

        <a class="bc-profile-chip" href="profile.html">
          <div class="bc-profile-avatar" data-current-user-avatar></div>
          <div class="bc-profile-info">
            <strong data-current-user-name></strong>
            <span data-current-user-role></span>
          </div>
        </a>
      </header>

      <section class="bc-content">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:20px">
          <div>
            <h1 class="page-title small">Profile Settings</h1>
            <p class="page-subtitle">Manage your company information</p>
          </div>

          <button id="editBtn" class="btn yellow" style="padding:12px 24px">
            ✎ Edit
          </button>
        </div>

        <div class="card" style="max-width:900px;padding:32px">
          <div style="display:flex;align-items:center;gap:22px;margin-bottom:26px">
            <div
              id="profileAvatar"
              style="
                width:78px;
                height:78px;
                border-radius:18px;
                background:var(--yellow);
                color:#000;
                display:flex;
                align-items:center;
                justify-content:center;
                font-size:34px;
                font-weight:900;
              "
            >
              AI
            </div>

            <div>
              <div id="profileTitle" style="font-size:20px;font-weight:800">Business Account</div>
              <div id="profileSub" style="color:#9ca3af;margin-top:6px">Loaded</div>
            </div>
          </div>

          <div style="height:1px;background:#262626;margin-bottom:24px"></div>

          <form id="profileForm">
            <div class="profile-field">
              <label>Company Name</label>
              <input id="companyName" type="text" disabled />
            </div>

            <div class="profile-field">
              <label>Full Name</label>
              <input id="fullName" type="text" disabled />
            </div>

            <div class="profile-field">
              <label>Email Address</label>
              <input id="emailAddress" type="email" disabled />
            </div>

            <div class="profile-field">
              <label>Phone Number</label>
              <input id="phoneNumber" type="text" disabled />
            </div>

            <div class="profile-field">
              <label>Address</label>
              <input id="address" type="text" disabled />
            </div>

            <div id="formStatus" style="display:none;margin-top:16px;padding:12px;border-radius:10px;font-size:14px"></div>

            <button id="saveBtn" type="submit" class="btn yellow" style="display:none;margin-top:20px;padding:12px 24px">
              Save Changes
            </button>
          </form>
        </div>
      </section>
    </main>
  </div>

  <style>
    .profile-field {
      margin-bottom: 18px;
    }

    .profile-field label {
      display: block;
      margin-bottom: 8px;
      color: #a8b3c7;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .profile-field input {
      width: 100%;
      height: 54px;
      border: 1px solid #1f2937;
      border-radius: 12px;
      background: #050505;
      color: #ffffff;
      padding: 0 16px;
      font-size: 15px;
      outline: none;
    }

    .profile-field input:disabled {
      color: #d1d5db;
      opacity: 0.9;
    }

    .profile-field input:not(:disabled) {
      border-color: var(--yellow);
    }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const ROLE = "business-client";

      const TOKEN = (JSON.parse(localStorage.getItem("deliverysync-session-v1") || "null") || {}).token || "";
      const DEFAULT_EMAIL = "client@deliverysync.com";

      let currentUser = null;
      let isEditing = false;

      const form = document.getElementById("profileForm");
      const editBtn = document.getElementById("editBtn");
      const saveBtn = document.getElementById("saveBtn");

      const fields = {
        companyName: document.getElementById("companyName"),
        fullName: document.getElementById("fullName"),
        emailAddress: document.getElementById("emailAddress"),
        phoneNumber: document.getElementById("phoneNumber"),
        address: document.getElementById("address"),
      };

      

      const showStatus = (message, type = "success") => {
        const el = document.getElementById("formStatus");
        if (!el) return;

        el.style.display = "block";
        el.textContent = message;
        el.style.background = type === "error" ? "#331717" : "#0f2e1a";
        el.style.border = type === "error" ? "1px solid #ef4444" : "1px solid #10b981";
        el.style.color = type === "error" ? "#fecaca" : "#d1fae5";
      };

      const getArray = (result) => {
        if (Array.isArray(result)) return result;
        if (Array.isArray(result?.data)) return result.data;
        if (Array.isArray(result?.items)) return result.items;
        if (Array.isArray(result?.users)) return result.users;
        return [];
      };

      const normalize = (value) => String(value || "").trim().toLowerCase();

      const getUserDisplay = (user) => {
        const first = user.firstName || "";
        const last = user.lastName || "";
        const full = user.fullName || user.name || `${first} ${last}`.trim();
        const profileDetails = user.profileDetails || {};

        return {
          companyName:
            user.company ||
            user.companyName ||
            user.organization ||
            profileDetails.companyName ||
            full ||
            "Not available",
          fullName: full || profileDetails.fullName || user.customer || "Not available",
          email: user.email || "Not available",
          phone: user.phone || user.contact || profileDetails.companyContactNumber || "--",
          address: user.address || user.location || profileDetails.businessAddress || "Not available",
        };
      };

      const fillForm = (user) => {
        const d = getUserDisplay(user);

        fields.companyName.value = d.companyName;
        fields.fullName.value = d.fullName;
        fields.emailAddress.value = d.email;
        fields.phoneNumber.value = d.phone;
        fields.address.value = d.address;

        document.getElementById("topCompanyName").textContent = d.companyName;
        document.getElementById("profileTitle").textContent = d.companyName;
        document.getElementById("profileSub").textContent = d.email;

        const initials = d.companyName
          .split(" ")
          .filter(Boolean)
          .slice(0, 2)
          .map((word) => word[0])
          .join("")
          .toUpperCase();

        document.getElementById("profileAvatar").textContent = initials || "AI";
      };

      const setEditMode = (enabled) => {
        isEditing = enabled;

        Object.values(fields).forEach((input) => {
          input.disabled = !enabled;
        });

        saveBtn.style.display = enabled ? "inline-flex" : "none";
        editBtn.textContent = enabled ? "Cancel" : "✎ Edit";
      };

      const loadProfile = async () => {
        try {
          if (!window.DeliverySyncAPI) {
            throw new Error("DeliverySyncAPI is not loaded. Check api-client.js path.");
          }

          const session = JSON.parse(localStorage.getItem("deliverysync-session-v1") || "null");

          if (!session || !session.userId) {
            throw new Error("No active session. Please log in again.");
          }

          const getById = DeliverySyncAPI.Users && (DeliverySyncAPI.Users.getById || DeliverySyncAPI.Users.getOne);

          if (typeof getById !== "function") {
            throw new Error("DeliverySyncAPI.Users.getById is unavailable.");
          }

          currentUser = await getById(session.userId);

          if (!currentUser || String(currentUser.id) !== String(session.userId)) {
            throw new Error("Could not load the logged-in business client's profile.");
          }

          fillForm(currentUser);

          console.log("BUSINESS CLIENT PROFILE:", currentUser);

          console.table({
            profileId: currentUser.id || "No ID",
            role: currentUser.role || "No role",
            email: currentUser.email || "No email",
            source: `back-end/data/users.json through GET /api/users/${session.userId}`,
          });

        } catch (error) {
          console.error("Profile backend sync failed:", error);
          currentUser = null;

          const errorBox = document.getElementById("profileError");
          if (errorBox) {
            errorBox.textContent = `Unable to load your profile: ${error.message}`;
            errorBox.style.display = "block";
          } else {
            alert(`Unable to load your profile: ${error.message}`);
          }
        }
      };

      editBtn.addEventListener("click", () => {
        setEditMode(!isEditing);
        document.getElementById("formStatus").style.display = "none";
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (!currentUser) return;
const payload = {
  name: fields.fullName.value.trim(),
  email: fields.emailAddress.value.trim(),
  phone: fields.phoneNumber.value.trim(),
  companyName: fields.companyName.value.trim(),
  company: fields.companyName.value.trim(),
  address: fields.address.value.trim(),
  role: currentUser.role || ROLE,
  status: currentUser.status || "Active",
};

        try {
          console.log("SUBMITTING PROFILE UPDATE:", payload);

          let response = null;

          if (currentUser.id && DeliverySyncAPI.Users && DeliverySyncAPI.Users.update) {
            response = await DeliverySyncAPI.Users.update(currentUser.id, payload);
          } else if (currentUser.id) {
            response = await fetch(`http://localhost:3000/api/users/${currentUser.id}`, {
              method: "PUT",
              headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + TOKEN,
              },
              body: JSON.stringify(payload),
            }).then((res) => {
              if (!res.ok) throw new Error(`Profile update failed with status ${res.status}`);
              return res.json();
            });
          } else {
            throw new Error("User ID missing. Cannot update profile.");
          }

          currentUser = response || payload;
          fillForm(currentUser);
          setEditMode(false);

          console.log("PROFILE UPDATE RESPONSE:", response);

          console.table({
            profileUpdated: true,
            profileId: currentUser.id,
            companyName: fields.companyName.value,
            email: fields.emailAddress.value,
          });

          showStatus("Profile updated successfully.", "success");

         
        } catch (error) {
          console.error("Profile update failed:", error);
          showStatus(`Profile update failed: ${error.message}`, "error");
          setVerification(`Profile update failed: ${error.message}`, true);
        }
      });

      await loadProfile();
    });
  </script>
</body>
