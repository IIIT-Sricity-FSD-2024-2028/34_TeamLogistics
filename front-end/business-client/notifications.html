      <section class="bc-content">

          <section class="notifications-header-card">

            <div>

                Notifications

              </p>

          </section>

          <div class="notifications-tabs">

            <button
              id="allTab"
              type="button"
              class="notification-tab active"

              All Notifications
            </button>

              type="button"
              class="notification-tab"
            >

            </button>

            </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {

      const ROLE = "business-client";



      const TOKEN = (JSON.parse(localStorage.getItem("deliverysync-session-v1") || "null") || {}).token || "";
      let allNotifications = [];
      let currentFilter = "all";

      const list =
        document.getElementById("notificationsList");

      const newCountBadge =
        document.getElementById("newCountBadge");

      const unreadTabCount =
        document.getElementById("unreadTabCount");

      const allTab =
        document.getElementById("allTab");

      const unreadTab =
        document.getElementById("unreadTab");

      const markAllReadBtn =
        document.getElementById("markAllReadBtn");

      const getArray = (result) => {

        if (Array.isArray(result)) {
          return result;
        }

        if (Array.isArray(result?.data)) {
          return result.data;
        }

        if (Array.isArray(result?.items)) {
          return result.items;
        }

        if (Array.isArray(result?.notifications)) {
          return result.notifications;
        }

        return [];
      };

      const normalize = (value) => {
        return String(value || "")
          .trim()
          .toLowerCase();
      };

      const belongsToClient = (notification) => {

        const to = normalize(
          notification.to ||
          notification.role ||
          notification.target ||
          notification.recipient
        );

        return (
          !to ||
          to === ROLE ||
          to === "business-client" ||
          to === "client" ||
          to === "all" ||
          to.includes("business")
        );
      };

      const escapeHtml = (value) => {

        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");

      };

      const getIcon = (notification) => {

        const text = normalize(
          `${notification.title} ${notification.message}`
        );

        if (
          text.includes("payment") ||
          text.includes("invoice")
        ) {
          return "✓";
        }

        if (
          text.includes("delay") ||
          text.includes("overdue")
        ) {
          return "!";
        }

        if (
          text.includes("completed") ||
          text.includes("delivered")
        ) {
          return "✓";
        }

        return "◈";
      };

      const render = () => {

        const unreadCount =
          allNotifications.filter(
            (n) => !n.read
          ).length;

        newCountBadge.textContent =
          `${unreadCount} New`;

        unreadTabCount.textContent =
          unreadCount;

        const items =
          currentFilter === "unread"
            ? allNotifications.filter(
                (n) => !n.read
              )
            : allNotifications;

        if (!items.length) {

          list.innerHTML = `
            <div class="notifications-empty">
              No ${
                currentFilter === "unread"
                  ? "unread "
                  : ""
              }notifications found.
            </div>
          `;

          return;
        }

        list.innerHTML =
          items
            .map((notification) => {

              const title =
                notification.title ||
                "Notification";

              const message =
                notification.message ||
                notification.description ||
                "--";

              const time =
                notification.time ||
                notification.createdAt ||
                "Just now";

              const isUnread =
                !notification.read;

              return `
                <div class="notification-item">

                  <div class="notification-icon">
                    ${escapeHtml(
                      getIcon(notification)
                    )}
                  </div>

                  <div class="notification-content">

                    <h3>
                      ${escapeHtml(title)}
                    </h3>

                    <p>
                      ${escapeHtml(message)}
                    </p>

                    <div class="notification-time">
                      ◷ ${escapeHtml(time)}
                    </div>

                  </div>

                  <div class="notification-actions">

                    ${
                      isUnread
                        ? `
                          <div
                            class="notification-dot unread"
                            title="Unread"
                          ></div>
                        `
                        : ""
                    }

                    <button
                      type="button"
                      class="delete-notification"
                      data-delete-notification="${escapeHtml(
                        notification.id ||
                        notification.notificationId ||
                        ""
                      )}"
                      title="Delete notification"
                      aria-label="Delete notification"
                    >
                      <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 6h18"></path>
                        <path d="M8 6V4h8v2"></path>
                        <path d="M19 6l-1 15H6L5 6"></path>
                        <path d="M10 11v6"></path>
                        <path d="M14 11v6"></path>
                      </svg>
                    </button>

                  </div>

                </div>
              `;

            })
            .join("");

      };

      const setActiveTab = () => {

        if (currentFilter === "all") {

          allTab.classList.add("active");
          unreadTab.classList.remove("active");

        } else {

          unreadTab.classList.add("active");
          allTab.classList.remove("active");

        }

      };

      const deleteNotificationLocally = (id) => {

        if (!id) {
          return false;
        }

        const before =
          allNotifications.length;

        allNotifications =
          allNotifications.filter(
            (notification) => {

              const notificationId =
                notification.id ||
                notification.notificationId;

              return String(notificationId) !== String(id);

            }
          );

        return allNotifications.length !== before;
      };

      const loadNotifications = async () => {

        try {

          if (!window.DeliverySyncAPI) {
            throw new Error(
              "DeliverySyncAPI is not loaded. Check api-client.js path."
            );
          }

          let result;

          if (
            DeliverySyncAPI.Notifications &&
            DeliverySyncAPI.Notifications.getAll
          ) {

            result =
              await DeliverySyncAPI.Notifications.getAll();

          } else {

            result =
              await fetch(
                "http://localhost:3000/api/notifications",
                {
                  headers: {
                    "Authorization": "Bearer " + TOKEN
                  }
                }
              ).then((res) => {

                if (!res.ok) {
                  throw new Error(
                    `Notifications fetch failed with status ${res.status}`
                  );
                }

                return res.json();

              });

          }

          const notifications =
            getArray(result);

          allNotifications =
            notifications.filter(
              belongsToClient
            );

          console.log(
            "RAW NOTIFICATIONS API RESULT:",
            result
          );

          console.log(
            "BUSINESS CLIENT NOTIFICATIONS:",
            allNotifications
          );

          console.table({

            notificationsLoadedFromBackend:
              notifications.length,

            clientNotifications:
              allNotifications.length,

            unreadForClient:
              allNotifications.filter(
                (n) => !n.read
              ).length,

            source:
              "GET /api/notifications"

          });

          render();
          setActiveTab();

        } catch (error) {

          console.error(
            "Notifications backend sync failed:",
            error
          );

          list.innerHTML = `
            <div class="notifications-error">
              Could not load notifications.
            </div>
          `;

        }

      };

      allTab.addEventListener(
        "click",
        () => {

          currentFilter = "all";

          setActiveTab();
          render();

        }
      );

      unreadTab.addEventListener(
        "click",
        () => {

          currentFilter = "unread";

          setActiveTab();
          render();

        }
      );

      markAllReadBtn.addEventListener(
        "click",
        async () => {

          try {

            markAllReadBtn.disabled = true;
            markAllReadBtn.textContent =
              "Marking as read...";

            console.log(
              "MARK ALL AS READ CLICKED"
            );

            let response = null;

            if (
              DeliverySyncAPI.Notifications &&
              DeliverySyncAPI.Notifications.markRead
            ) {

              response =
                await DeliverySyncAPI.Notifications.markRead();

            } else {

              response =
                await fetch(
                  "http://localhost:3000/api/notifications/mark-read",
                  {
                    method: "PATCH",

                    headers: {
                      "Content-Type":
                        "application/json",

                      "Authorization": "Bearer " + TOKEN
                    },

                    body: JSON.stringify({
                      to: ROLE
                    })
                  }
                ).then((res) => {

                  if (!res.ok) {
                    throw new Error(
                      `Mark read failed with status ${res.status}`
                    );
                  }

                  return res.json();

                });

            }

            console.log(
              "MARK READ RESPONSE:",
              response
            );

            allNotifications =
              allNotifications.map(
                (n) => ({
                  ...n,
                  read: true
                })
              );

            render();

            markAllReadBtn.textContent =
              "All notifications read";

            console.table({

              markAllReadSubmitted:
                true,

              clientNotificationsMarkedRead:
                allNotifications.length

            });

            setTimeout(() => {

              markAllReadBtn.disabled = false;

              markAllReadBtn.textContent =
                "Mark all as read";

            }, 1200);

          } catch (error) {

            console.error(
              "Mark all read failed:",
              error
            );

            markAllReadBtn.disabled = false;

            markAllReadBtn.textContent =
              "Mark all as read";

          }

        }
      );

      list.addEventListener(
        "click",
        (event) => {

          const button =
            event.target.closest(
              "[data-delete-notification]"
            );

          if (!button) {
            return;
          }

          const id =
            button.getAttribute(
              "data-delete-notification"
            );

          if (!id) {
            return;
          }

          const confirmed =
            window.confirm(
              "Delete this notification?"
            );

          if (!confirmed) {
            return;
          }

          const deleted =
            deleteNotificationLocally(id);

          if (deleted) {
            render();
          }

        }
      );

      await loadNotifications();

    });
  </script>



  <style>

    .notifications-page{
      width:100%;
      max-width:none;
    }

    .notifications-header-card{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:24px;

      padding:28px 32px;

      background:
        linear-gradient(
          135deg,
          #1f1f1f,
          #171717
        );

      border:1px solid #262626;
      border-radius:18px;
    }

    .notifications-header-card h1{
      margin:0 0 8px;
      font-size:30px;
      line-height:1.15;
    }

    .notifications-header-card p{
      margin:0;
      color:#9ca3af;
      font-size:16px;
    }

    .notifications-count{
      flex:none;

      background:var(--yellow);
      color:#000;

      font-size:16px;
      font-weight:900;

      padding:10px 18px;

      border-radius:999px;
      white-space:nowrap;
    }

    .notifications-tabs{
      display:flex;
      align-items:center;
      gap:28px;

      margin-top:18px;

      border-bottom:1px solid #262626;
    }

    .notification-tab{
      appearance:none;
      border:0;
      background:none;

      color:#a8a8a8;

      padding:14px 0;

      font:inherit;
      font-weight:800;

      cursor:pointer;

      border-bottom:2px solid transparent;
    }

    .notification-tab.active{
      color:var(--yellow);
      border-bottom-color:var(--yellow);
    }

    .notifications-list{
      margin-top:22px;
      overflow:hidden;

      border:1px solid #262626;
      border-radius:18px;
    }

    .notification-item{
      display:grid;
      grid-template-columns:48px minmax(0,1fr) 10px;
      gap:18px;
      align-items:start;

      padding:22px 24px;

      background:
        linear-gradient(
          135deg,
          #1f1f1f,
          #171717
        );

      border-bottom:1px solid #292929;
    }

    .notification-item:last-child{
      border-bottom:none;
    }

    .notification-icon{
      width:46px;
      height:46px;

      border-radius:12px;

      background:#050505;

      display:flex;
      align-items:center;
      justify-content:center;

      color:var(--yellow);

      font-size:20px;
      font-weight:900;
    }

    .notification-content{
      min-width:0;
    }

    .notification-content h3{
      margin:0 0 8px;

      font-size:18px;
      font-weight:800;

      color:#fff;
    }

    .notification-content p{
      margin:0;

      color:#cbd5e1;

      line-height:1.5;

      font-size:15px;
    }

    .notification-time{
      margin-top:12px;

      color:#9ca3af;

      font-size:13px;
    }

    .notification-actions{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:10px;
      margin-top:4px;
      flex-shrink:0;
    }

    .delete-notification{
      width:34px;
      height:34px;
      display:flex;
      align-items:center;
      justify-content:center;
      border:1px solid #343434;
      border-radius:10px;
      background:#111;
      color:#9ca3af;
      cursor:pointer;
      transition:.2s ease;
      flex-shrink:0;
    }

    .delete-notification svg{
      width:17px;
      height:17px;
      fill:none;
      stroke:currentColor;
      stroke-width:1.8;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .delete-notification:hover{
      color:#ff6b6b;
      border-color:#ff4444;
      background:rgba(255,68,68,.08);
    }

    .delete-notification:disabled{
      opacity:.5;
      cursor:not-allowed;
    }

    .notification-dot{
      width:8px;
      height:8px;

      border-radius:50%;

      background:#4b5563;

      margin-top:10px;
    }

    .notification-dot.unread{
      background:var(--yellow);
    }

    .notifications-empty,
    .notifications-error,
    .notifications-loading{
      padding:30px;

      text-align:center;

      color:#9ca3af;

      background:#171717;
    }

    .notifications-error{
      color:#fecaca;
      background:#331717;
      border:1px solid #ef4444;
    }

    .notifications-footer{
      display:flex;
      justify-content:center;

      margin-top:24px;
    }

    .notifications-footer .btn{
      min-height:44px;
      padding:0 22px;
    }

    @media (max-width:800px){

      .notifications-header-card{
        align-items:flex-start;
        flex-direction:column;
      }

      .notifications-count{
        align-self:flex-start;
      }

    }

    @media (max-width:600px){

      .notification-item{
        grid-template-columns:42px minmax(0,1fr);
        gap:12px;
        padding:18px;
      }

      .notification-actions{
        grid-column:2;
        justify-content:flex-start;
        margin-top:2px;
      }

      .notification-icon{
        width:42px;
        height:42px;
      }

      .notifications-header-card{
        padding:22px;
      }

      .notifications-header-card h1{
        font-size:26px;
      }

    }

  </style>
