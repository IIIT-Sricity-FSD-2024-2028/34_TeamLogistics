<main class="main"><div class="topbar"><div class="pagehead"><h1>Edit Vehicle</h1><p>Update asset details and availability</p></div><div class="toptools"><label class="search"><span>⌕</span><input placeholder="Search..."/></label><a aria-label="Notifications" class="iconbox iconlink notif-link" href="notifications.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M15 17H5l1.3-1.3A2 2 0 0 0 7 14.3V10a5 5 0 1 1 10 0v4.3a2 2 0 0 0 .6 1.4L19 17h-4"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg><span class="dot">3</span></a><div class="avatar">FM</div><div class="usertext"><strong>Fleet Manager</strong><span>Administrator</span></div></div></div><div class="content"><a class="muted" href="vehicles.html">← Back</a><section class="panel" style="margin-top:14px"><div class="panel-head"><div class="panel-title">Edit Vehicle</div></div><div class="panel-body"><div class="form-grid"><div class="field"><label>Plate Number</label><input id="edit-vehicle-plate" type="text" value="TN09AB2345"/><div class="field-error" id="edit-vehicle-plate-error"></div></div><div class="field"><label>Status</label><select id="edit-vehicle-status"><option>Active</option><option>Maintenance</option><option>Blocked</option><option>On Trip</option></select></div><div class="field"><label>Last Maintenance Date</label><input id="edit-vehicle-maintenance" type="date" value="2026-03-10"/></div><div class="field"><label>Availability</label><select id="edit-vehicle-availability"><option>Available</option><option>Unavailable</option></select></div></div><div class="footer-actions"><button class="btn btn-ghost">Cancel</button><button class="btn btn-yellow">Update Vehicle</button></div></div></section></div></main></div><script>
(function(){
  const params = new URLSearchParams(location.search);
  const vehicleId = params.get('id');
  const plateInput = document.getElementById('edit-vehicle-plate');
  const statusInput = document.getElementById('edit-vehicle-status');
  const maintenanceInput = document.getElementById('edit-vehicle-maintenance');
  const availabilityInput = document.getElementById('edit-vehicle-availability');
  const plateError = document.getElementById('edit-vehicle-plate-error');
  const buttons = document.querySelectorAll('.footer-actions button');
  const cancelBtn = buttons[0];
  const saveBtn = buttons[1];

  function readState(){
    if(window.FleetManagerData && window.FleetManagerData.readCoreState){
      return window.FleetManagerData.readCoreState() || {vehicles:[]};
    }
    return {vehicles:[]};
  }
  function writeState(state){
    if(window.FleetManagerData && window.FleetManagerData.writeCoreState){
      window.FleetManagerData.writeCoreState(state);
    }
  }
  function clearPlateError(){
    if(plateError) plateError.textContent='';
    if(plateInput) plateInput.classList.remove('error');
  }
  function setPlateError(message){
    if(plateError) plateError.textContent=message;
    if(plateInput) plateInput.classList.add('error');
  }

  const state = readState();
  state.vehicles = Array.isArray(state.vehicles) ? state.vehicles : [];
  const fallbackVehicles = (window.FleetManagerData && Array.isArray(window.FleetManagerData.vehicles)) ? window.FleetManagerData.vehicles : [];
  let current = state.vehicles.find(v => String(v.id) === String(vehicleId));
  if(!current) current = fallbackVehicles.find(v => String(v.id) === String(vehicleId)) || fallbackVehicles[0] || {};

  if(plateInput) plateInput.value = String(current.plate || '').replace(/[^A-Za-z0-9]/g,'').toUpperCase() || 'TN09AB2345';
  if(statusInput) statusInput.value = current.status || 'Active';
  if(maintenanceInput) maintenanceInput.value = current.maintenance || '2026-03-10';
  if(availabilityInput) availabilityInput.value = current.availability || (String(current.status||'').toLowerCase()==='active' ? 'Available' : 'Unavailable');

  if(cancelBtn) cancelBtn.addEventListener('click', function(e){ e.preventDefault(); location.href='vehicles.html'; });
  if(plateInput) plateInput.addEventListener('input', clearPlateError);

  if(saveBtn) saveBtn.addEventListener('click', function(e){
    e.preventDefault();
    clearPlateError();
    const plateValue = String(plateInput?.value || '').trim().toUpperCase();
    if(!/^[A-Z]{2}\d{2}[A-Z]{2}\d{4}$/.test(plateValue)){
      setPlateError('Enter a valid plate number like TN32AV1234.');
      return;
    }
    const updated = {
      ...current,
      id: current.id || vehicleId,
      plate: plateValue,
      status: statusInput?.value || current.status || 'Active',
      maintenance: maintenanceInput?.value || current.maintenance || '',
      availability: availabilityInput?.value || current.availability || 'Available'
    };

    const index = state.vehicles.findIndex(v => String(v.id) === String(updated.id));
    if(index >= 0) state.vehicles[index] = {...state.vehicles[index], ...updated};
    else state.vehicles.push(updated);
    writeState(state);

    if(window.FleetManagerData && Array.isArray(window.FleetManagerData.vehicles)){
      const staticIndex = window.FleetManagerData.vehicles.findIndex(v => String(v.id) === String(updated.id));
      if(staticIndex >= 0) window.FleetManagerData.vehicles[staticIndex] = {...window.FleetManagerData.vehicles[staticIndex], ...updated};
    }

    location.href='vehicles.html';
  });
})();
</script><script src="../assets/js/fleet-backend-sync.js"></script></body></html>
