  <script>
    (function () {

      var ROLE = "fleet-manager";

      var notifications = [];
      var currentFilter = "unread";

      var list =
        document.getElementById("notificationList");

      var unreadFilterText =
        document.getElementById("unreadFilterText");

      var allCount =
        document.getElementById("allCount");

      var criticalCount =
        document.getElementById("criticalCount");

      var highCount =
        document.getElementById("highCount");

      var headerUnreadDot =
        document.getElementById("headerUnreadDot");

      var markAllReadBtn =
        document.getElementById("markAllReadBtn");

      var refreshBtn =
        document.getElementById("refreshBtn");

      function getArray(result) {

        if (Array.isArray(result)) {
          return result;
        }

        if (result && Array.isArray(result.data)) {
          return result.data;
        }

        if (result && Array.isArray(result.items)) {
          return result.items;
        }

        if (
          result &&
          Array.isArray(result.notifications)
        ) {
          return result.notifications;
        }

        return [];

      }

      function escapeHtml(value) {

        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");

      }

      function normalize(value) {

        return String(value || "")
          .trim()
          .toLowerCase();

      }

      function getPriority(notification) {

        var priority =
          notification.priority ||
          notification.severity ||
          notification.level ||
          notification.type ||
          "";

        priority = normalize(priority);

        if (
          priority === "critical" ||
          priority === "urgent" ||
          priority === "danger"
        ) {
          return "critical";
        }

        if (
          priority === "high" ||
          priority === "important"
        ) {
          return "high";
        }

        var text =
          normalize(
            (notification.title || "") +
            " " +
            (notification.message || "")
          );

        if (
          text.includes("blocked") ||
          text.includes("suspended") ||
          text.includes("violation") ||
          text.includes("critical")
        ) {
          return "critical";
        }

        if (
          text.includes("expir") ||
          text.includes("maintenance") ||
          text.includes("overdue") ||
          text.includes("warning")
        ) {
          return "high";
        }

        return "normal";

      }

      function getIconClass(notification) {

        var text =
          normalize(
            (notification.title || "") +
            " " +
            (notification.message || "")
          );

        if (
          text.includes("maintenance") ||
          text.includes("service")
        ) {
          return "icon-maintenance";
        }

        if (
          text.includes("violation") ||
          text.includes("blocked") ||
          text.includes("critical") ||
          text.includes("warning")
        ) {
          return "icon-critical";
        }

        if (
          text.includes("document") ||
          text.includes("insurance") ||
          text.includes("certificate") ||
          text.includes("expiry") ||
          text.includes("expire")
        ) {
          return "icon-document";
        }

        if (
          text.includes("driver") ||
          text.includes("user")
        ) {
          return "icon-user";
        }

        if (
          text.includes("vehicle")
        ) {
          return "icon-lock";
        }

        return "icon-document";

      }

      function getIconSvg(notification) {

        var iconClass =
          getIconClass(notification);

        if (
          iconClass === "icon-maintenance"
        ) {

          return `
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M14.7 6.3a4 4 0 0 0 3 5.7l-7.4 7.4a2 2 0 1 1-2.8-2.8l7.4-7.4a4 4 0 0 1-5.7-3"></path>
            </svg>
          `;

        }

        if (
          iconClass === "icon-critical"
        ) {

          return `
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M12 9v4"></path>
              <path d="M12 17h.01"></path>
              <path d="M10.3 3.9 2.6 18a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path>
            </svg>
          `;

        }

        if (
          iconClass === "icon-user"
        ) {

          return `
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <circle cx="9" cy="8" r="3"></circle>
              <path d="M4 19a5 5 0 0 1 10 0"></path>
              <circle cx="17.5" cy="10.5" r="2"></circle>
            </svg>
          `;

        }

        if (
          iconClass === "icon-lock"
        ) {

          return `
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <rect height="10" rx="2" width="14" x="5" y="10"></rect>
              <path d="M8 10V7a4 4 0 1 1 8 0v3"></path>
            </svg>
          `;

        }

        return `
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M8 3h6l5 5v13H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"></path>
            <path d="M14 3v5h5"></path>
          </svg>
        `;

      }

      function formatTime(value) {

        if (!value) {
          return "Recently";
        }

        var date =
          new Date(value);

        if (
          Number.isNaN(
            date.getTime()
          )
        ) {
          return String(value);
        }

        return date.toLocaleString(
          "en-IN",
          {
            day: "2-digit",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
          }
        );

      }

      function getNotificationTime(notification) {

        return (
          notification.time ||
          notification.createdAt ||
          notification.updatedAt ||
          notification.timestamp ||
          "Recently"
        );

      }

      function matchesRole(notification) {

        var target =
          normalize(
            notification.to ||
            notification.role ||
            notification.target ||
            notification.recipient
          );

        if (!target) {
          return true;
        }

        return (
          target === ROLE ||
          target === "fleet-manager" ||
          target === "fleet manager" ||
          target === "all" ||
          target.includes("fleet")
        );

      }

      function getTone(priority) {

        if (priority === "critical") {
          return "tone-olive";
        }

        if (priority === "high") {
          return "tone-olive";
        }

        return "tone-dark";

      }

      function render() {

        var unread =
          notifications.filter(
            function (n) {
              return !n.read;
            }
          );

        var critical =
          notifications.filter(
            function (n) {
              return getPriority(n) === "critical";
            }
          );

        var high =
          notifications.filter(
            function (n) {
              return getPriority(n) === "high";
            }
          );

        unreadFilterText.textContent =
          unread.length + " Unread";

        allCount.textContent =
          notifications.length;

        criticalCount.textContent =
          critical.length;

        highCount.textContent =
          high.length;

        headerUnreadDot.textContent =
          unread.length;

        var filtered =
          notifications.filter(
            function (notification) {

              if (
                currentFilter === "unread"
              ) {
                return !notification.read;
              }

              if (
                currentFilter === "critical"
              ) {
                return (
                  getPriority(notification) ===
                  "critical"
                );
              }

              if (
                currentFilter === "high"
              ) {
                return (
                  getPriority(notification) ===
                  "high"
                );
              }

              return true;

            }
          );

        if (!filtered.length) {

          list.innerHTML = `
            <div
              style="
                padding:50px 24px;
                text-align:center;
                color:#9e9e9e;
              "
            >
              <div
                style="
                  font-size:18px;
                  font-weight:700;
                  color:#fff;
                  margin-bottom:8px;
                "
              >
                No notifications found
              </div>

              <div>
                There are no notifications in this category.
              </div>
            </div>
          `;

          return;

        }

        list.innerHTML =
          filtered.map(
            function (notification) {

              var title =
                notification.title ||
                notification.subject ||
                "Notification";

              var message =
                notification.message ||
                notification.description ||
                notification.body ||
                "No additional details available.";

              var priority =
                getPriority(notification);

              var time =
                getNotificationTime(notification);

              var id =
                notification.id ||
                notification.notificationId ||
                "";

              var tag =
                notification.category ||
                notification.type ||
                notification.event ||
                "";

              var read =
                Boolean(notification.read);

              return `
                <article
                  class="notif-card ${getTone(priority)}"
                  data-notification-id="${escapeHtml(id)}"
                >

                  <div
                    class="
                      notif-card-icon
                      ${getIconClass(notification)}
                    "
                  >
                    ${getIconSvg(notification)}
                  </div>

                  <div class="notif-card-main">

                    <div class="notif-card-title-row">

                      <h3>
                        ${escapeHtml(title)}

                        ${
                          !read
                            ? `<span class="title-dot"></span>`
                            : ""
                        }

                      </h3>

                      ${
                        priority !== "normal"
                          ? `
                            <span
                              class="
                                notif-level
                                ${priority}
                              "
                            >
                              ${
                                priority === "critical"
                                  ? "Critical"
                                  : "High"
                              }
                            </span>
                          `
                          : ""
                      }

                    </div>

                    <p>
                      ${escapeHtml(message)}
                    </p>

                    <div class="notif-tags">

                      ${
                        tag
                          ? `
                            <span class="tag yellow">
                              ${escapeHtml(tag)}
                            </span>
                          `
                          : ""
                      }

                      ${
                        notification.vehicleId
                          ? `
                            <span class="meta-code">
                              ${escapeHtml(
                                notification.vehicleId
                              )}
                            </span>
                          `
                          : ""
                      }

                      ${
                        notification.driverId
                          ? `
                            <span class="meta-code">
                              ${escapeHtml(
                                notification.driverId
                              )}
                            </span>
                          `
                          : ""
                      }

                    </div>

                  </div>

                  <div class="notif-time">

                    <span>
                      ${escapeHtml(
                        formatTime(time)
                      )}
                    </span>

                    ${
                      notification.createdAt
                        ? `
                          <span>
                            ${escapeHtml(
                              new Date(
                                notification.createdAt
                              ).toLocaleDateString(
                                "en-IN",
                                {
                                  day: "2-digit",
                                  month: "short",
                                  year: "numeric"
                                }
                              )
                            )}
                          </span>
                        `
                        : ""
                    }

                    <button
                      aria-label="Dismiss notification"
                      type="button"
                      class="dismiss-notification"
                      data-dismiss-id="${escapeHtml(id)}"
                    >
                      ×
                    </button>

                  </div>

                </article>
              `;

            }
          ).join("");

      }

      async function loadNotifications() {

        try {

          list.innerHTML = `
            <div
              style="
                padding:40px;
                text-align:center;
                color:#9e9e9e;
              "
            >
              Loading notifications...
            </div>
          `;

          var result;

          /*
           * Prefer the shared API client when available.
           * The direct fetch fallback guarantees the Fleet Manager
           * role is explicitly sent to the backend.
           */

          if (
            window.DeliverySyncAPI &&
            DeliverySyncAPI.Notifications &&
            DeliverySyncAPI.Notifications.getAll
          ) {

            result =
              await DeliverySyncAPI.Notifications.getAll();

          } else {

            var response =
              await fetch(
                "http://localhost:3000/api/notifications",
                {
                  method: "GET",
                  headers: {
                    "x-user-role": ROLE
                  }
                }
              );

            if (!response.ok) {

              throw new Error(
                "GET /api/notifications failed with status " +
                response.status
              );

            }

            result =
              await response.json();

          }

          var backendNotifications =
            getArray(result);

          notifications =
            backendNotifications.filter(
              matchesRole
            );

          console.table({
            source:
              "GET /api/notifications",

            role:
              ROLE,

            backendNotifications:
              backendNotifications.length,

            fleetManagerNotifications:
              notifications.length,

            unread:
              notifications.filter(
                function (n) {
                  return !n.read;
                }
              ).length
          });

          render();

        } catch (error) {

          console.error(
            "Fleet Manager notifications backend error:",
            error
          );

          list.innerHTML = `
            <div
              style="
                padding:32px;
                text-align:center;
                background:#331717;
                border:1px solid #ef4444;
                color:#fecaca;
              "
            >
              <div
                style="
                  font-size:17px;
                  font-weight:800;
                  margin-bottom:6px;
                "
              >
                Unable to load notifications
              </div>

              <div>
                ${escapeHtml(
                  error.message ||
                  "Backend request failed."
                )}
              </div>
            </div>
          `;

        }

      }

      async function markAllRead() {

        try {

          markAllReadBtn.disabled =
            true;

          markAllReadBtn.textContent =
            "Marking as Read...";

          var response;

          if (
            window.DeliverySyncAPI &&
            DeliverySyncAPI.Notifications &&
            DeliverySyncAPI.Notifications.markRead
          ) {

            response =
              await DeliverySyncAPI.Notifications.markRead();

          } else {

            var result =
              await fetch(
                "http://localhost:3000/api/notifications/mark-read",
                {
                  method: "PATCH",

                  headers: {
                    "Content-Type":
                      "application/json",

                    "x-user-role":
                      ROLE
                  },

                  body: JSON.stringify({
                    to: ROLE
                  })
                }
              );

            if (!result.ok) {

              throw new Error(
                "PATCH /api/notifications/mark-read failed with status " +
                result.status
              );

            }

            response =
              await result.json();

          }

          console.log(
            "Fleet Manager mark-read response:",
            response
          );

          /*
           * Reload from backend so the UI reflects
           * the actual backend state.
           */
          await loadNotifications();

          markAllReadBtn.textContent =
            "All Notifications Read";

          setTimeout(
            function () {
              markAllReadBtn.textContent =
                "Mark All as Read";
            },
            1200
          );

        } catch (error) {

          console.error(
            "Fleet Manager mark-read error:",
            error
          );

          markAllReadBtn.textContent =
            "Mark All as Read";

          alert(
            "Unable to mark notifications as read."
          );

        } finally {

          markAllReadBtn.disabled =
            false;

        }

      }

      document
        .querySelectorAll(".notif-filter")
        .forEach(
          function (button) {

            button.addEventListener(
              "click",
              function () {

                document
                  .querySelectorAll(
                    ".notif-filter"
                  )
                  .forEach(
                    function (item) {
                      item.classList.remove(
                        "active"
                      );
                    }
                  );

                button.classList.add(
                  "active"
                );

                currentFilter =
                  button.dataset.filter ||
                  "all";

                render();

              }
            );

          }
        );

      markAllReadBtn.addEventListener(
        "click",
        markAllRead
      );

      refreshBtn.addEventListener(
        "click",
        loadNotifications
      );

      /*
       * Dismiss is intentionally local only.
       * It does not call a backend DELETE endpoint.
       */
      list.addEventListener(
        "click",
        function (event) {

          var button =
            event.target.closest(
              ".dismiss-notification"
            );

          if (!button) {
            return;
          }

          var id =
            button.dataset.dismissId;

          var card =
            button.closest(
              ".notif-card"
            );

          if (card) {
            card.remove();
          }

          if (id) {

            notifications =
              notifications.filter(
                function (notification) {

                  var notificationId =
                    notification.id ||
                    notification.notificationId ||
                    "";

                  return (
                    String(notificationId) !==
                    String(id)
                  );

                }
              );

            render();

          }

        }
      );

      loadNotifications();

    })();
  </script>

</body>
</html>
