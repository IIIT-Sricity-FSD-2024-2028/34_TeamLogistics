html"><span class="ico"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 20V9"></path><path d="M10 20V4"></path><path d="M16 20v-7"></path><path d="M22 20V12"></path></svg></span><span>Analytics</span></a><a class="" href="notifications.html"><span class="ico"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M15 17H5l1.3-1.3A2 2 0 0 0 7 14.3V10a5 5 0 1 1 10 0v4.3a2 2 0 0 0 .6 1.4L19 17h-4"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg></span><span>Notifications</span></a><a class="" href="subscription.html"><span class="ico"><svg aria-hidden="true" viewBox="0 0 24 24"><rect height="14" rx="2" width="20" x="2" y="5"></rect><path d="M2 10h20"></path></svg></span><span>Subscription</span></a><a class="" href="profile.html"><span class="ico"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 20a8 8 0 0 1 16 0"></path></svg></span><span>Profile</span></a></nav><a class="logout" href="../login.html"><span class="ico"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg></span><span>Logout</span></a></aside>
<main class="main"><div class="topbar"><div class="pagehead"><h1>Edit Driver</h1><p>Update driver profile and assignment</p></div><div class="toptools"><a aria-label="Notifications" class="iconbox iconlink notif-link" href="notifications.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M15 17H5l1.3-1.3A2 2 0 0 0 7 14.3V10a5 5 0 1 1 10 0v4.3a2 2 0 0 0 .6 1.4L19 17h-4"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg><span class="dot">3</span></a><div class="avatar" data-current-user-avatar></div><div class="usertext"><strong data-current-user-name></strong><span data-current-user-role></span></div></div></div><div class="content"><a class="muted" href="driver-profile.html">← Back</a><section class="panel" style="margin-top:14px"><div class="panel-head"><div class="panel-title">Edit Driver</div></div><div class="panel-body"><div class="form-grid"><div class="field"><label>Full Name</label><input id="edit-driver-full-name" type="text" value="Rajesh Kumar"/><div class="field-error" id="edit-driver-full-name-error"></div></div><div class="field"><label>Phone</label><input id="edit-driver-phone" type="text" value="9876543210"/><div class="field-error" id="edit-driver-phone-error"></div></div><div class="field"><label>Email</label><input id="edit-driver-email" type="text" value="rajesh.kumar@fleet.in"/><div class="field-error" id="edit-driver-email-error"></div></div><div class="field"><label>Status</label><select id="edit-driver-status"><option>Active</option><option>Suspended</option></select></div><div class="field"><label>Experience</label><input id="edit-driver-experience" type="text" value="8"/><div class="field-error" id="edit-driver-experience-error"></div></div><div class="field"><label>Notes</label><textarea id="edit-driver-notes">High performing driver with strong on-time record.</textarea></div></div><div class="footer-actions"><button class="btn btn-ghost">Cancel</button><button class="btn btn-yellow">Save Changes</button></div></div></section></div></main></div>
<script>
(function(){
  const params = new URLSearchParams(location.search);
  const driverId = params.get('id');
  const fields = document.querySelectorAll('.form-grid .field');
  const inputs = {
    fullName: document.getElementById('edit-driver-full-name'),
    phone: document.getElementById('edit-driver-phone'),
    email: document.getElementById('edit-driver-email'),
    status: document.getElementById('edit-driver-status'),
    experience: document.getElementById('edit-driver-experience'),
    notes: document.getElementById('edit-driver-notes')
  };
  const cancelBtn = document.querySelector('.footer-actions .btn-ghost');
  const saveBtn = document.querySelector('.footer-actions .btn-yellow');
  if(cancelBtn) cancelBtn.addEventListener('click', (e)=>{ e.preventDefault(); location.href='drivers.html'; });

  const rows = window.FleetManagerData.getDrivers ? window.FleetManagerData.getDrivers() : (window.FleetManagerData.drivers||[]);
  const current = rows.find(d => String(d.id)===String(driverId)) || rows[0] || {};
  if(inputs.fullName) inputs.fullName.value = current.name || '';
  if(inputs.phone) inputs.phone.value = current.phone || '';
  if(inputs.email) inputs.email.value = current.email || '';
  if(inputs.status) inputs.status.value = current.status || 'Active';
  if(inputs.experience) inputs.experience.value = String(current.experienceYears ?? current.experience ?? '').replace(/[^0-9]/g,'') || '8';
  if(inputs.notes) inputs.notes.value = current.notes || 'High performing driver with strong on-time record.';

  function setFieldError(input, message){
    const errorEl = document.getElementById((input?.id || '') + '-error');
    if(input) input.classList.add('error');
    if(errorEl){ errorEl.textContent = message || ''; errorEl.style.color = '#ef4444'; }
  }
  function clearFieldError(input){
    const errorEl = document.getElementById((input?.id || '') + '-error');
    if(input) input.classList.remove('error');
    if(errorEl){ errorEl.textContent = ''; errorEl.style.color = '#ef4444'; }
  }
  [inputs.fullName, inputs.phone, inputs.email, inputs.experience].forEach((input)=>{
    if(!input) return;
    input.addEventListener('input', ()=> clearFieldError(input));
  });

  if(saveBtn) saveBtn.addEventListener('click', (e)=>{
    e.preventDefault();
    const fullName = inputs.fullName?.value.trim() || '';
    const phone = inputs.phone?.value.trim() || '';
    const email = inputs.email?.value.trim() || '';
    const experience = inputs.experience?.value.trim() || '';
    const notes = inputs.notes?.value || '';
    const emailRegex = /^(?=.{1,64}@)(?=.{6,320}$)(?!\.)(?!.*\.\.)([A-Za-z0-9!#$%&'*+\-/=?^_`{|}~]+(?:\.[A-Za-z0-9!#$%&'*+\-/=?^_`{|}~]+)*)@([A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+)$/;
    let hasError = false;
    [inputs.fullName, inputs.phone, inputs.email, inputs.experience].forEach(clearFieldError);

    if(!/^[A-Za-z ]+$/.test(fullName) || fullName.length < 2){ setFieldError(inputs.fullName, 'Full name should contain only letters and spaces.'); hasError = true; }
    if(!/^[6-9]\d{9}$/.test(phone)){ setFieldError(inputs.phone, 'Phone number should start with 9, 8, 7, or 6 and contain exactly 10 digits.'); hasError = true; }
    if(!emailRegex.test(email)){ setFieldError(inputs.email, 'Enter a valid email address in personal_info@domain format.'); hasError = true; }
    if(!/^\d+$/.test(experience) || Number(experience) < 0 || Number(experience) > 40){ setFieldError(inputs.experience, 'Please enter valid driving experience between 0 and 40 years.'); hasError = true; }
    if(hasError) return;

    const updated = {
      ...current,
      id: current.id || driverId,
      name: fullName,
      phone,
      email,
      status: inputs.status?.value || current.status,
      vehicle: current.vehicle,
      experienceYears: Number(experience),
      notes
    };
    if(window.FleetManagerData.syncDriverToCore){
      window.FleetManagerData.syncDriverToCore(updated);
    }
    location.href='drivers.html';
  });
})();
</script>
<script src="../assets/js/fleet-backend-sync.js"></script></body></html>
