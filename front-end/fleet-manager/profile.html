<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Profile | DeliverSync</title>

  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="../assets/css/brand-logo.css">
  <link href="../assets/css/fleet-manager.css" rel="stylesheet"/>

  <script src="../assets/js/api-client.js"></script>
  <script src="../assets/js/fleet-manager.js"></script>

  <style>
    .fm-error {
      color: #ef4444;
      font-size: 13px;
      margin-top: 6px;
      min-height: 18px;
    }

    .profile-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .profile-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }

    .profile-actions .btn {
      min-width: 110px;
      justify-content: center;
    }

    @media (max-width: 900px) {
      .profile-grid {
        grid-template-columns: 1fr;
      }

      .profile-actions {
        justify-content: flex-start;
      }
    }
  </style>

  <script src="../assets/js/brand-logo.js"></script>
  <script src="../assets/js/current-user.js" defer></script>
</head>

<body>
  <div class="fleet-layout">

    <aside class="sidebar">

      <div class="brand">
        <div
          class="ds-brand-logo"
          data-href="dashboard.html"
          data-size="sm"
          data-sub="Fleet Manager Portal">
        </div>
      </div>

      <nav class="nav">

        <a href="dashboard.html">
          <span class="ico">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <rect height="6" rx="1" width="6" x="4" y="4"></rect>
              <rect height="6" rx="1" width="6" x="14" y="4"></rect>
              <rect height="6" rx="1" width="6" x="4" y="14"></rect>
              <rect height="6" rx="1" width="6" x="14" y="14"></rect>
            </svg>
          </span>
          <span>Dashboard</span>
        </a>

        <a href="vehicles.html">
          <span class="ico">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M3 14V9a2 2 0 0 1 2-2h8l3 3h3a2 2 0 0 1 2 2v2"></path>
              <circle cx="7" cy="16.5" r="2"></circle>
              <circle cx="17" cy="16.5" r="2"></circle>
            </svg>
          </span>
          <span>Vehicles</span>
        </a>

        <a href="drivers.html">
          <span class="ico">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <circle cx="9" cy="8" r="3"></circle>
              <path d="M4 19a5 5 0 0 1 10 0"></path>
              <circle cx="17" cy="9" r="2"></circle>
              <path d="M15 19a4 4 0 0 1 5-3.8"></path>
            </svg>
          </span>
          <span>Drivers</span>
        </a>

        <a href="compliance.html">
          <span class="ico">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M12 3l7 3v5c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6l7-3z"></path>
            </svg>
          </span>
          <span>Compliance</span>
        </a>

        <a href="trips.html">
          <span class="ico">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M5 12h12"></path>
              <path d="M13 6l6 6-6 6"></path>
            </svg>
          </span>
          <span>Trips</span>
        </a>

        <a href="maintenance.html">
          <span class="ico">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M14.7 6.3a4 4 0 0 0 3 5.7l-7.4 7.4a2 2 0 1 1-2.8-2.8l7.4-7.4a4 4 0 0 0-5.7-3"></path>
            </svg>
          </span>
          <span>Maintenance</span>
        </a>

        <a href="documents.html">
          <span class="ico">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M8 3h6l5 5v13H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"></path>
              <path d="M14 3v5h5"></path>
            </svg>
          </span>
          <span>Documents</span>
        </a>

        <a href="analytics.html">
          <span class="ico">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M4 20V9"></path>
              <path d="M10 20V4"></path>
              <path d="M16 20v-7"></path>
              <path d="M22 20V12"></path>
            </svg>
          </span>
          <span>Analytics</span>
        </a>

        <a href="notifications.html">
          <span class="ico">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M15 17H5l1.3-1.3A2 2 0 0 0 7 14.3V10a5 5 0 1 1 10 0v4.3a2 2 0 0 0 .6 1.4L19 17h-4"></path>
              <path d="M10 20a2 2 0 0 0 4 0"></path>
            </svg>
          </span>
          <span>Notifications</span>
        </a>

        <a href="subscription.html">
          <span class="ico">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <rect height="14" rx="2" width="20" x="2" y="5"></rect>
              <path d="M2 10h20"></path>
            </svg>
          </span>
          <span>Subscription</span>
        </a>

        <a class="active" href="profile.html">
          <span class="ico">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4 20a8 8 0 0 1 16 0"></path>
            </svg>
          </span>
          <span>Profile</span>
        </a>

      </nav>

      <a class="logout" href="../login.html">
        <span class="ico">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <path d="M16 17l5-5-5-5"></path>
            <path d="M21 12H9"></path>
          </svg>
        </span>
        <span>Logout</span>
      </a>

    </aside>

    <main class="main">

      <div class="topbar">

        <div class="pagehead">
          <h1>Profile</h1>
          <p>Fleet manager account information</p>
        </div>

        <div class="toptools">

          <a
            aria-label="Notifications"
            class="iconbox iconlink notif-link"
            href="notifications.html">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M15 17H5l1.3-1.3A2 2 0 0 0 7 14.3V10a5 5 0 1 1 10 0v4.3a2 2 0 0 0 .6 1.4L19 17h-4"></path>
              <path d="M10 20a2 2 0 0 0 4 0"></path>
            </svg>
            <span class="dot">3</span>
          </a>

          <div class="avatar" data-current-user-avatar></div>

          <div class="usertext">
            <strong data-current-user-name></strong>
            <span data-current-user-role></span>
          </div>

        </div>

      </div>

      <div class="content">

        <div style="display:flex;justify-content:flex-end;margin-bottom:16px;">
          <button
            type="button"
            class="btn btn-yellow"
            id="fm-profile-edit-btn">
            Edit
          </button>
        </div>

        <div
          class="info-card"
          style="max-width:1100px;margin:0 auto;padding:26px;">

          <div
            style="display:flex;align-items:center;gap:18px;margin-bottom:22px;">

            <div
              id="fm-profile-avatar"
              style="
                width:88px;
                height:88px;
                border-radius:24px;
                background:var(--yellow);
                color:#111;
                display:grid;
                place-items:center;
                font-weight:900;
                font-size:34px;">
              RS
            </div>

            <div>
              <div
                id="fm-profile-heading"
                style="font-size:34px;font-weight:800;color:#fff;">
                Riya Sharma
              </div>

              <div
                class="muted"
                style="font-size:20px;">
                Fleet Manager Account
              </div>
            </div>

          </div>

          <div class="profile-grid">

            <div class="field">
              <label>Full Name</label>
              <input
                value="Riya Sharma"
                id="fm-full-name"
                readonly/>
              <div
                class="fm-error"
                id="err-fm-full-name">
              </div>
            </div>

            <div class="field">
              <label>Email Address</label>
              <input
                value="fleet@deliverysync.com"
                id="fm-email"
                readonly/>
              <div
                class="fm-error"
                id="err-fm-email">
              </div>
            </div>

            <div class="field">
              <label>Phone Number</label>
              <input
                value="+91 98765 00000"
                id="fm-phone"
                readonly/>
              <div
                class="fm-error"
                id="err-fm-phone">
              </div>
            </div>

            <div class="field">
              <label>Company Name</label>
              <input
                value="DeliverSync Logistics Pvt Ltd"
                id="fm-company-name"
                readonly/>
              <div
                class="fm-error"
                id="err-fm-company-name">
              </div>
            </div>

            <div class="field">
              <label>Company Address</label>
              <input
                value="OMR, Chennai"
                id="fm-company-address"
                readonly/>
              <div
                class="fm-error"
                id="err-fm-company-address">
              </div>
            </div>

            <div class="field">
              <label>Number of Vehicles</label>
              <input
                value="24"
                id="fm-number-of-vehicles"
                readonly/>
              <div
                class="fm-error"
                id="err-fm-number-of-vehicles">
              </div>
            </div>

          </div>

          <div
            class="profile-actions"
            id="fm-profile-actions"
            style="display:none;">

            <button
              type="button"
              class="btn btn-ghost"
              id="fm-profile-cancel-btn">
              Cancel
            </button>

            <button
              type="button"
              class="btn btn-yellow"
              id="fm-profile-save-btn">
              Save Profile
            </button>

          </div>

        </div>

      </div>

    </main>

  </div>

  <script>
    (function(){

      const STATE_KEY = 'deliverysync-state-v1';

      const editBtn = document.getElementById('fm-profile-edit-btn');
      const actions = document.getElementById('fm-profile-actions');
      const cancelBtn = document.getElementById('fm-profile-cancel-btn');
      const saveBtn = document.getElementById('fm-profile-save-btn');

      const ids = [
        'fm-full-name',
        'fm-email',
        'fm-phone',
        'fm-company-name',
        'fm-company-address',
        'fm-number-of-vehicles'
      ];

      const [
        nameInput,
        emailInput,
        phoneInput,
        companyInput,
        addressInput,
        vehiclesInput
      ] = ids.map(id => document.getElementById(id));

      let editing = false;

      let originalValues = {};

      function readState(){
        try{
          return JSON.parse(
            localStorage.getItem(STATE_KEY) || '{}'
          );
        }catch(e){
          return {};
        }
      }

      function saveState(s){
        localStorage.setItem(
          STATE_KEY,
          JSON.stringify(s)
        );

        window.dispatchEvent(
          new Event('deliverysync:state-updated')
        );
      }

      function getCurrentFleetManagerUser(s){

        const users = Array.isArray(s.users)
          ? s.users
          : [];

        const sessionRaw =
          localStorage.getItem('deliverysync-session-v1');

        let session = null;

        try{
          session = sessionRaw
            ? JSON.parse(sessionRaw)
            : null;
        }catch(e){
          session = null;
        }

        if(
          session &&
          session.role === 'fleet-manager'
        ){

          return (
            users.find(
              x =>
                String(x.id || '') ===
                String(session.userId || '')
            ) ||

            users.find(
              x =>
                (x.email || '').toLowerCase() ===
                String(session.email || '').toLowerCase()
            ) ||

            users.find(
              x =>
                String(x.role || '').toLowerCase() ===
                'fleet-manager'
            ) ||

            {}
          );
        }

        return (
          users.find(
            x =>
              String(x.role || '').toLowerCase() ===
              'fleet-manager'
          ) || {}
        );
      }

      function loadFromState(){

        const s = readState();

        const u = getCurrentFleetManagerUser(s);

        const d = u.profileDetails || {};

        nameInput.value =
          u.name ||
          nameInput.value;

        emailInput.value =
          u.email ||
          emailInput.value;

        phoneInput.value =
          u.phone ||
          phoneInput.value;

        companyInput.value =
          d.companyName ||
          companyInput.value;

        addressInput.value =
          d.companyAddress ||
          d.address ||
          addressInput.value;

        vehiclesInput.value =
          d.numberOfVehicles ||
          vehiclesInput.value;

        const title =
          document.getElementById(
            'fm-profile-heading'
          );

        if(title){
          title.textContent =
            nameInput.value;
        }

        const initials =
          (nameInput.value || 'FM')
            .split(/\s+/)
            .map(x => x[0])
            .join('')
            .slice(0,2)
            .toUpperCase();

        const avatar =
          document.getElementById(
            'fm-profile-avatar'
          );

        if(avatar){
          avatar.textContent = initials;
        }

        const topName =
          document.querySelector(
            '.usertext strong'
          );

        if(topName){
          topName.textContent =
            nameInput.value;
        }

        const topAvatar =
          document.querySelector(
            '.toptools .avatar'
          );

        if(topAvatar){
          topAvatar.textContent =
            initials;
        }
      }

      function clearErrors(){

        ids.forEach(id => {

          const error =
            document.getElementById(
              'err-' + id
            );

          if(error){
            error.textContent = '';
          }

        });
      }

      function setEditingState(value){

        editing = value;

        ids.forEach(id => {

          const el =
            document.getElementById(id);

          if(el){
            el.readOnly = !editing;
          }

        });

        actions.style.display =
          editing ? 'flex' : 'none';

        editBtn.style.display =
          editing ? 'none' : 'inline-flex';
      }

      function saveOriginalValues(){

        originalValues = {};

        ids.forEach(id => {

          const el =
            document.getElementById(id);

          if(el){
            originalValues[id] =
              el.value;
          }

        });
      }

      function restoreOriginalValues(){

        ids.forEach(id => {

          const el =
            document.getElementById(id);

          if(el && originalValues[id] !== undefined){
            el.value =
              originalValues[id];
          }

        });
      }

      loadFromState();

      editBtn.addEventListener(
        'click',
        function(){

          saveOriginalValues();

          clearErrors();

          setEditingState(true);

        }
      );

      cancelBtn.addEventListener(
        'click',
        function(){

          restoreOriginalValues();

          clearErrors();

          loadFromState();

          setEditingState(false);

        }
      );

      saveBtn.addEventListener(
        'click',
        function(){

          const fullName =
            nameInput.value.trim();

          const email =
            emailInput.value.trim();

          const phone =
            phoneInput.value.trim();

          const companyName =
            companyInput.value.trim();

          const companyAddress =
            addressInput.value.trim();

          const vehicleCount =
            vehiclesInput.value.trim();

          clearErrors();

          let hasError = false;

          if(
            !/^[A-Za-z][A-Za-z\s]{2,59}$/.test(
              fullName
            )
          ){
            const e =
              document.getElementById(
                'err-fm-full-name'
              );

            if(e){
              e.textContent =
                'Full name must contain only letters and spaces.';
            }

            hasError = true;
          }

          if(
            !/^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.com$/.test(
              email
            )
          ){
            const e =
              document.getElementById(
                'err-fm-email'
              );

            if(e){
              e.textContent =
                'Email address must end with .com';
            }

            hasError = true;
          }

          const phoneDigits =
            phone.replace(/\D/g,'');

          if(
            !/^[6-9]\d{9}$/.test(
              phoneDigits
            ) &&
            !/^(91)?[6-9]\d{9}$/.test(
              phoneDigits
            )
          ){
            const e =
              document.getElementById(
                'err-fm-phone'
              );

            if(e){
              e.textContent =
                'Phone number must contain a valid 10-digit Indian number.';
            }

            hasError = true;
          }

          if(
            !/^[A-Za-z][A-Za-z\s]{2,79}$/.test(
              companyName
            )
          ){
            const e =
              document.getElementById(
                'err-fm-company-name'
              );

            if(e){
              e.textContent =
                'Company name must contain only letters and spaces.';
            }

            hasError = true;
          }

          if(
            companyAddress.length < 5
          ){
            const e =
              document.getElementById(
                'err-fm-company-address'
              );

            if(e){
              e.textContent =
                'Company address should not be too small.';
            }

            hasError = true;
          }

          if(
            !/^\d+$/.test(
              vehicleCount
            )
          ){
            const e =
              document.getElementById(
                'err-fm-number-of-vehicles'
              );

            if(e){
              e.textContent =
                'Number of vehicles must contain only numbers.';
            }

            hasError = true;
          }

          if(hasError){
            setEditingState(true);
            return;
          }

          const s =
            readState();

          const currentUser =
            getCurrentFleetManagerUser(s);

          const currentId =
            currentUser && currentUser.id
              ? String(currentUser.id)
              : '';

          const currentEmail =
            currentUser && currentUser.email
              ? String(currentUser.email).toLowerCase()
              : '';

          if(
            Array.isArray(s.users)
          ){

            const idx =
              s.users.findIndex(
                x =>
                  String(x.id || '') === currentId ||
                  (
                    (x.email || '').toLowerCase() ===
                    currentEmail &&
                    String(x.role || '').toLowerCase() ===
                    'fleet-manager'
                  )
              );

            if(idx >= 0){

              s.users[idx].name =
                fullName;

              s.users[idx].email =
                email;

              s.users[idx].phone =
                phone;

              s.users[idx].profileDetails = {
                ...(s.users[idx].profileDetails || {}),
                companyName,
                companyAddress,
                numberOfVehicles:
                  vehicleCount
              };

            }

          }

          if(
            s.superuser &&
            Array.isArray(s.superuser.users)
          ){

            const idx =
              s.superuser.users.findIndex(
                x =>
                  String(x.id || '') === currentId ||
                  (
                    String(x.role || '')
                      .toLowerCase()
                      .includes('fleet manager') &&
                    (x.email || '').toLowerCase() ===
                    currentEmail
                  )
              );

            if(idx >= 0){

              s.superuser.users[idx].name =
                fullName;

              s.superuser.users[idx].email =
                email;

              s.superuser.users[idx].phone =
                phone;

              s.superuser.users[idx].profileDetails = {
                ...(s.superuser.users[idx].profileDetails || {}),
                companyName,
                companyAddress,
                numberOfVehicles:
                  vehicleCount
              };

            }

          }

          if(
            Array.isArray(s.fleets)
          ){

            const idx =
              s.fleets.findIndex(
                x =>
                  String(x.manager || '')
                    .toLowerCase() ===
                    String(currentUser.name || '')
                      .toLowerCase() ||

                  String(x.company || '')
                    .toLowerCase() ===
                    String(
                      (
                        currentUser.profileDetails || {}
                      ).companyName || ''
                    ).toLowerCase() ||

                  x.id === 'FL-001'
              );

            if(idx >= 0){

              s.fleets[idx].company =
                companyName;

              s.fleets[idx].manager =
                fullName;

              s.fleets[idx].vehicles =
                Number(vehicleCount) ||
                vehicleCount;

            }

          }

          saveState(s);

          loadFromState();

          clearErrors();

          setEditingState(false);

        }
      );

      window.addEventListener(
        'storage',
        function(e){

          if(e.key === STATE_KEY){

            loadFromState();

            if(!editing){
              setEditingState(false);
            }

          }

        }
      );

    })();
  </script>


</body>
</html>
