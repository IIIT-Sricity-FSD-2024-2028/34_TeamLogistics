.html"><span class="ico"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 20V9"></path><path d="M10 20V4"></path><path d="M16 20v-7"></path><path d="M22 20V12"></path></svg></span><span>Analytics</span></a><a class="" href="notifications.html"><span class="ico"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M15 17H5l1.3-1.3A2 2 0 0 0 7 14.3V10a5 5 0 1 1 10 0v4.3a2 2 0 0 0 .6 1.4L19 17h-4"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg></span><span>Notifications</span></a><a class="active" href="profile.html"><span class="ico"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 20a8 8 0 0 1 16 0"></path></svg></span><span>Profile</span></a><a class="" href="settings.html"><span class="ico"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></span><span>Settings</span></a></nav><a class="logout" href="../login.html"><span class="ico"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg></span><span>Logout</span></a></aside><main class="main"><div class="topbar"><div class="pagehead"><h1>Profile</h1><p>Fleet manager account information</p></div><div class="toptools"><label class="search"><span>⌕</span><input placeholder="Search..."/></label><a aria-label="Notifications" class="iconbox iconlink notif-link" href="notifications.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M15 17H5l1.3-1.3A2 2 0 0 0 7 14.3V10a5 5 0 1 1 10 0v4.3a2 2 0 0 0 .6 1.4L19 17h-4"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg><span class="dot">3</span></a><div class="avatar">FM</div><div class="usertext"><strong>Fleet Manager</strong><span>Administrator</span></div><div class="caret">⌄</div></div></div><div class="content"><div style="display:flex;justify-content:flex-end;margin-bottom:16px"><button class="btn btn-yellow" id="fm-profile-edit-btn">Edit</button></div><div class="info-card" style="max-width:1100px;margin:0 auto;padding:26px"><div style="display:flex;align-items:center;gap:18px;margin-bottom:22px"><div id="fm-profile-avatar" style="width:88px;height:88px;border-radius:24px;background:var(--yellow);color:#111;display:grid;place-items:center;font-weight:900;font-size:34px">RS</div><div><div id="fm-profile-heading" style="font-size:34px;font-weight:800;color:#fff">Riya Sharma</div><div class="muted" style="font-size:20px">Fleet Manager Account</div></div></div><div class="profile-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:18px"><div class="field"><label>Full Name</label><input value="Riya Sharma" id="fm-full-name" readonly/><div class="fm-error" id="err-fm-full-name"></div></div><div class="field"><label>Email Address</label><input value="fleet@deliverysync.com" id="fm-email" readonly/><div class="fm-error" id="err-fm-email"></div></div><div class="field"><label>Phone Number</label><input value="+91 98765 00000" id="fm-phone" readonly/><div class="fm-error" id="err-fm-phone"></div></div><div class="field"><label>Company Name</label><input value="DeliverSync Logistics Pvt Ltd" id="fm-company-name" readonly/><div class="fm-error" id="err-fm-company-name"></div></div><div class="field"><label>Company Address</label><input value="OMR, Chennai" id="fm-company-address" readonly/><div class="fm-error" id="err-fm-company-address"></div></div><div class="field"><label>Number of Vehicles</label><input value="24" id="fm-number-of-vehicles" readonly/><div class="fm-error" id="err-fm-number-of-vehicles"></div></div></div></div></div></main></div><script>
(function(){
  const STATE_KEY='deliverysync-state-v1';
  const btn=document.getElementById('fm-profile-edit-btn');
  const ids=['fm-full-name','fm-email','fm-phone','fm-company-name','fm-company-address','fm-number-of-vehicles'];
  const [nameInput,emailInput,phoneInput,companyInput,addressInput,vehiclesInput]=ids.map(id=>document.getElementById(id));
  function readState(){ try{return JSON.parse(localStorage.getItem(STATE_KEY)||'{}');}catch(e){return {};}}
  function saveState(s){ localStorage.setItem(STATE_KEY, JSON.stringify(s)); window.dispatchEvent(new Event('deliverysync:state-updated')); }
  function getCurrentFleetManagerUser(s){
    const users = Array.isArray(s.users) ? s.users : [];
    const sessionRaw = localStorage.getItem('deliverysync-session-v1');
    let session = null;
    try{ session = sessionRaw ? JSON.parse(sessionRaw) : null; }catch(e){ session = null; }
    if(session && session.role === 'fleet-manager'){
      return users.find(x=>String(x.id||'')===String(session.userId||'')) || users.find(x=>(x.email||'').toLowerCase()===String(session.email||'').toLowerCase()) || users.find(x=>String(x.role||'').toLowerCase()==='fleet-manager') || {};
    }
    return users.find(x=>String(x.role||'').toLowerCase()==='fleet-manager') || {};
  }
  function loadFromState(){
    const s=readState();
    const u=getCurrentFleetManagerUser(s);
    const d=u.profileDetails||{};
    nameInput.value = u.name || nameInput.value;
    emailInput.value = u.email || emailInput.value;
    phoneInput.value = u.phone || phoneInput.value;
    companyInput.value = d.companyName || companyInput.value;
    addressInput.value = d.companyAddress || d.address || addressInput.value;
    vehiclesInput.value = d.numberOfVehicles || vehiclesInput.value;
    const title=document.getElementById('fm-profile-heading'); if(title) title.textContent=nameInput.value;
    const initials=(nameInput.value||'FM').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();
    const avatar=document.getElementById('fm-profile-avatar'); if(avatar) avatar.textContent=initials;
    const topName=document.querySelector('.usertext strong'); if(topName) topName.textContent=nameInput.value;
    const topAvatar=document.querySelector('.toptools .avatar'); if(topAvatar) topAvatar.textContent=initials;
  }
  loadFromState();
  let editing=false;
  btn.addEventListener('click',()=>{
    editing=!editing;
    ids.forEach(id=>{ const el=document.getElementById(id); if(el) el.readOnly=!editing; });
    if(editing){ btn.textContent='Save'; return; }

    const fullName = nameInput.value.trim();
    const email = emailInput.value.trim();
    const phone = phoneInput.value.trim();
    const companyName = companyInput.value.trim();
    const companyAddress = addressInput.value.trim();
    const vehicleCount = vehiclesInput.value.trim();

    ['fm-full-name','fm-email','fm-phone','fm-company-name','fm-company-address','fm-number-of-vehicles'].forEach(id=>{ const e=document.getElementById('err-'+id); if(e) e.textContent=''; });
    let hasError=false;
    if(!/^[A-Za-z][A-Za-z\s]{2,59}$/.test(fullName)){
      const e=document.getElementById('err-fm-full-name'); if(e) e.textContent='Full name must contain only letters and spaces.'; hasError=true;
    }
    if(!/^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.com$/.test(email)){
      const e=document.getElementById('err-fm-email'); if(e) e.textContent='Email address must end with .com'; hasError=true;
    }
    if(!/^[6-9]\d{9}$/.test(phone.replace(/\D/g,''))){
      const e=document.getElementById('err-fm-phone'); if(e) e.textContent='Phone number must be 10 digits and start with 9, 8, 7, or 6.'; hasError=true;
    }
    if(!/^[A-Za-z][A-Za-z\s]{2,79}$/.test(companyName)){
      const e=document.getElementById('err-fm-company-name'); if(e) e.textContent='Company name must contain only letters and spaces.'; hasError=true;
    }
    if(companyAddress.length < 5){
      const e=document.getElementById('err-fm-company-address'); if(e) e.textContent='Company address should not be too small.'; hasError=true;
    }
    if(!/^\d+$/.test(vehicleCount)){
      const e=document.getElementById('err-fm-number-of-vehicles'); if(e) e.textContent='Number of vehicles must contain only numbers.'; hasError=true;
    }
    if(hasError){ editing=true; btn.textContent='Save'; ids.forEach(id=>{ const el=document.getElementById(id); if(el) el.readOnly=false; }); return; }

    const s=readState();
    const currentUser = getCurrentFleetManagerUser(s);
    const currentId = currentUser && currentUser.id ? String(currentUser.id) : '';
    const currentEmail = currentUser && currentUser.email ? String(currentUser.email).toLowerCase() : '';
    if(Array.isArray(s.users)){
      const idx=s.users.findIndex(x=>String(x.id||'')===currentId || ((x.email||'').toLowerCase()===currentEmail && String(x.role||'').toLowerCase()==='fleet-manager'));
      if(idx>=0){
        s.users[idx].name=fullName;
        s.users[idx].email=email;
        s.users[idx].phone=phone;
        s.users[idx].profileDetails={...(s.users[idx].profileDetails||{}), companyName, companyAddress, numberOfVehicles:vehicleCount};
      }
    }
    if(s.superuser && Array.isArray(s.superuser.users)){
      const idx=s.superuser.users.findIndex(x=>String(x.id||'')===currentId || (String(x.role||'').toLowerCase().includes('fleet manager') && (x.email||'').toLowerCase()===currentEmail));
      if(idx>=0){
        s.superuser.users[idx].name=fullName;
        s.superuser.users[idx].email=email;
        s.superuser.users[idx].phone=phone;
        s.superuser.users[idx].profileDetails={...(s.superuser.users[idx].profileDetails||{}), companyName, companyAddress, numberOfVehicles:vehicleCount};
      }
    }
    if(Array.isArray(s.fleets)){
      const idx=s.fleets.findIndex(x=>String(x.manager||'').toLowerCase()===String(currentUser.name||'').toLowerCase() || String(x.company||'').toLowerCase()===String((currentUser.profileDetails||{}).companyName||'').toLowerCase() || x.id==='FL-001');
      if(idx>=0){ s.fleets[idx].company=companyName; s.fleets[idx].manager=fullName; s.fleets[idx].vehicles=Number(vehicleCount)||vehicleCount; }
    }
    saveState(s); loadFromState(); btn.textContent='Edit';
  });

  window.addEventListener('storage', function(e){
    if(e.key === STATE_KEY){ loadFromState(); }
  });
})();
</script><script src="../assets/js/fleet-backend-sync.js"></script></body></html>
