  <script>

    document.addEventListener("DOMContentLoaded", async () => {

      const ROLE = "superuser";

      let notifications = [];
      let currentFilter = "all";

      const list =
        document.getElementById("notificationList");

      const allCount =
        document.getElementById("allCount");

      const unreadCount =
        document.getElementById("unreadCount");

      const readCount =
        document.getElementById("readCount");

      const criticalCount =
        document.getElementById("criticalCount");

      const highCount =
        document.getElementById("highCount");

      const newCount =
        document.getElementById("newCount");

      const headerUnreadCount =
        document.getElementById("headerUnreadCount");

      const markAllReadBtn =
        document.getElementById("markAllReadBtn");

      const refreshBtn =
        document.getElementById("refreshBtn");


      function getArray(result){

        if(Array.isArray(result)){
          return result;
        }

        if(Array.isArray(result?.data)){
          return result.data;
        }

        if(Array.isArray(result?.items)){
          return result.items;
        }

        if(Array.isArray(result?.notifications)){
          return result.notifications;
        }

        return [];
      }


      function escapeHtml(value){

        return String(value ?? "")
          .replace(/&/g,"&amp;")
          .replace(/</g,"&lt;")
          .replace(/>/g,"&gt;")
          .replace(/"/g,"&quot;")
          .replace(/'/g,"&#039;");
      }


      function priorityOf(notification){

        const explicit =
          String(
            notification.priority ||
            notification.severity ||
            notification.level ||
            ""
          ).toLowerCase();

        if(
          explicit === "critical" ||
          explicit === "urgent" ||
          explicit === "danger"
        ){
          return "critical";
        }

        if(
          explicit === "high" ||
          explicit === "important"
        ){
          return "high";
        }

        const text =
          String(
            `${notification.title || ""} ${notification.message || ""}`
          ).toLowerCase();

        if(
          text.includes("blocked") ||
          text.includes("suspended") ||
          text.includes("violation") ||
          text.includes("critical") ||
          text.includes("failed")
        ){
          return "critical";
        }

        if(
          text.includes("warning") ||
          text.includes("expire") ||
          text.includes("expired") ||
          text.includes("maintenance") ||
          text.includes("overdue")
        ){
          return "high";
        }

        return "normal";
      }


      function iconOf(notification){

        const text =
          String(
            `${notification.title || ""} ${notification.message || ""}`
          ).toLowerCase();

        if(
          text.includes("driver") ||
          text.includes("user") ||
          text.includes("account")
        ){
          return `
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="9" cy="8" r="3"></circle>
              <path d="M4 19a5 5 0 0 1 10 0"></path>
              <circle cx="17" cy="9" r="2"></circle>
            </svg>
          `;
        }

        if(
          text.includes("vehicle")
        ){
          return `
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 14V9a2 2 0 0 1 2-2h8l3 3h3a2 2 0 0 1 2 2v2"></path>
              <circle cx="7" cy="16.5" r="2"></circle>
              <circle cx="17" cy="16.5" r="2"></circle>
            </svg>
          `;
        }

        if(
          text.includes("maintenance") ||
          text.includes("service")
        ){
          return `
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M14.7 6.3a4 4 0 0 0 3 5.7l-7.4 7.4a2 2 0 1 1-2.8-2.8l7.4-7.4a4 4 0 0 1-5.7-3"></path>
            </svg>
          `;
        }

        if(
          text.includes("invoice") ||
          text.includes("payment") ||
          text.includes("document")
        ){
          return `
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 3h6l5 5v13H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"></path>
              <path d="M14 3v5h5"></path>
            </svg>
          `;
        }

        if(
          text.includes("blocked") ||
          text.includes("violation") ||
          text.includes("critical") ||
          text.includes("failed")
        ){
          return `
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 9v4"></path>
              <path d="M12 17h.01"></path>
              <path d="M10.3 3.9 2.6 18a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path>
            </svg>
          `;
        }

        return `
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 9a6 6 0 1 0-12 0v4l-2 3h16l-2-3V9"></path>
            <path d="M10 20h4"></path>
          </svg>
        `;
      }


      function formatTime(value){

        if(!value){
          return "Recently";
        }

        const date =
          new Date(value);

        if(Number.isNaN(date.getTime())){
          return String(value);
        }

        return date.toLocaleString(
          "en-IN",
          {
            day:"2-digit",
            month:"short",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
          }
        );
      }


      async function fetchNotifications(){

        let result;

        if(
          window.DeliverySyncAPI &&
          DeliverySyncAPI.Notifications &&
          DeliverySyncAPI.Notifications.getAll
        ){

          result =
            await DeliverySyncAPI.Notifications.getAll();

        }else{

          const response =
            await fetch(
              "http://localhost:3000/api/notifications",
              {
                method:"GET",
                headers:{
                  "x-user-role":ROLE
                }
              }
            );

          if(!response.ok){
            throw new Error(
              `GET /api/notifications failed with status ${response.status}`
            );
          }

          result =
            await response.json();
        }

        return getArray(result);
      }


      function render(){

        const unread =
          notifications.filter(
            n => !n.read
          );

        const read =
          notifications.filter(
            n => n.read
          );

        const critical =
          notifications.filter(
            n =>
              priorityOf(n) === "critical"
          );

        const high =
          notifications.filter(
            n =>
              priorityOf(n) === "high"
          );


        allCount.textContent =
          notifications.length;

        unreadCount.textContent =
          unread.length;

        readCount.textContent =
          read.length;

        criticalCount.textContent =
          critical.length;

        highCount.textContent =
          high.length;

        newCount.textContent =
          unread.length;

        headerUnreadCount.textContent =
          unread.length;


        let filtered =
          [...notifications];


        if(currentFilter === "unread"){

          filtered =
            filtered.filter(
              n => !n.read
            );
        }

        if(currentFilter === "read"){

          filtered =
            filtered.filter(
              n => n.read
            );
        }

        if(currentFilter === "critical"){

          filtered =
            filtered.filter(
              n =>
                priorityOf(n) ===
                "critical"
            );
        }

        if(currentFilter === "high"){

          filtered =
            filtered.filter(
              n =>
                priorityOf(n) ===
                "high"
            );
        }


        if(!filtered.length){

          list.innerHTML = `
            <div class="notification-empty">
              <strong>No notifications found</strong>
              There are no notifications in this category.
            </div>
          `;

          return;
        }


        list.innerHTML =
          filtered.map(
            notification => {

              const id =
                notification.id ||
                notification.notificationId ||
                "";

              const title =
                notification.title ||
                notification.subject ||
                "Notification";

              const message =
                notification.message ||
                notification.description ||
                notification.body ||
                "No additional details available.";

              const read =
                Boolean(notification.read);

              const priority =
                priorityOf(notification);

              const time =
                notification.time ||
                notification.createdAt ||
                notification.updatedAt ||
                notification.timestamp ||
                "Recently";

              const category =
                notification.category ||
                notification.type ||
                notification.event ||
                "";


              return `
                <article
                  class="notification-card ${read ? "" : "unread"}"
                  data-id="${escapeHtml(id)}"
                >

                  <div class="notification-icon">
                    ${iconOf(notification)}
                  </div>


                  <div class="notification-main">

                    <div class="notification-title-row">

                      <h3>
                        ${escapeHtml(title)}

                        ${
                          read
                            ? ""
                            : `
                              <span
                                class="unread-dot"
                                title="Unread"
                              ></span>
                            `
                        }

                      </h3>

                      <span
                        class="
                          priority
                          ${priority}
                        "
                      >
                        ${
                          priority === "critical"
                            ? "Critical"
                            : priority === "high"
                              ? "High"
                              : "Normal"
                        }
                      </span>

                    </div>


                    <p class="notification-message">
                      ${escapeHtml(message)}
                    </p>


                    <div class="notification-meta">

                      ${
                        category
                          ? `
                            <span class="meta-tag">
                              ${escapeHtml(category)}
                            </span>
                          `
                          : ""
                      }

                      ${
                        notification.to
                          ? `
                            <span class="meta-tag">
                              To: ${escapeHtml(notification.to)}
                            </span>
                          `
                          : ""
                      }

                      ${
                        notification.driverId
                          ? `
                            <span class="meta-tag">
                              ${escapeHtml(
                                notification.driverId
                              )}
                            </span>
                          `
                          : ""
                      }

                      ${
                        notification.vehicleId
                          ? `
                            <span class="meta-tag">
                              ${escapeHtml(
                                notification.vehicleId
                              )}
                            </span>
                          `
                          : ""
                      }

                    </div>

                  </div>


                  <div class="notification-side">

                    <div class="notification-time">
                      ${escapeHtml(
                        formatTime(time)
                      )}
                    </div>


                    <div class="notification-actions">

                      <button
                        type="button"
                        class="notif-action notif-read-btn"
                        data-read-id="${escapeHtml(id)}"
                      >
                        ${
                          read
                            ? "Mark unread"
                            : "Mark read"
                        }
                      </button>

                      <button
                        type="button"
                        class="notif-action notif-delete-btn"
                        data-delete-id="${escapeHtml(id)}"
                        aria-label="Delete notification"
                        title="Delete notification"
                      >
                        <svg
                          viewBox="0 0 24 24"
                          aria-hidden="true"
                        >
                          <path d="M3 6h18"></path>
                          <path d="M8 6V4h8v2"></path>
                          <path d="M19 6l-1 15H6L5 6"></path>
                          <path d="M10 11v6"></path>
                          <path d="M14 11v6"></path>
                        </svg>
                      </button>

                    </div>

                  </div>

                </article>
              `;

            }
          ).join("");
      }


      async function loadNotifications(){

        try{

          list.innerHTML = `
            <div class="notification-loading">
              Loading notifications from backend...
            </div>
          `;

          notifications =
            await fetchNotifications();


          console.table({
            source:"GET /api/notifications",
            role:ROLE,
            total:notifications.length,
            unread:
              notifications.filter(
                n => !n.read
              ).length
          });


          render();

        }catch(error){

          console.error(
            "Failed to load Super User notifications:",
            error
          );

          list.innerHTML = `
            <div class="notification-error">
              Unable to load notifications from backend.
              <br><br>
              ${escapeHtml(
                error.message ||
                "Backend request failed."
              )}
            </div>
          `;
        }
      }


      async function markAllRead(){

        try{

          markAllReadBtn.disabled =
            true;

          markAllReadBtn.textContent =
            "Marking as read...";


          if(
            window.DeliverySyncAPI &&
            DeliverySyncAPI.Notifications &&
            DeliverySyncAPI.Notifications.markAllRead
          ){

            await
              DeliverySyncAPI
                .Notifications
                .markAllRead();

          }else{

            const response =
              await fetch(
                "http://localhost:3000/api/notifications/mark-read",
                {
                  method:"PATCH",
                  headers:{
                    "Content-Type":
                      "application/json",
                    "x-user-role":
                      ROLE
                  },
                  body:JSON.stringify({
                    to:ROLE
                  })
                }
              );

            if(!response.ok){

              throw new Error(
                `Mark all read failed with status ${response.status}`
              );
            }
          }


          await loadNotifications();

        }catch(error){

          console.error(
            "Mark all as read failed:",
            error
          );

          alert(
            "Unable to mark all notifications as read."
          );

        }finally{

          markAllReadBtn.disabled =
            false;

          markAllReadBtn.textContent =
            "Mark All as Read";
        }
      }


      /*
       * These individual read/delete actions are frontend-only
       * for now because your backend currently exposes the
       * fetch-all and mark-all-read operations, but not individual
       * read/delete endpoints.
       */

      list.addEventListener(
        "click",
        event => {

          const readButton =
            event.target.closest(
              "[data-read-id]"
            );

          const deleteButton =
            event.target.closest(
              "[data-delete-id]"
            );


          if(readButton){

            const id =
              readButton.dataset.readId;

            const item =
              notifications.find(
                n =>
                  String(
                    n.id ||
                    n.notificationId ||
                    ""
                  ) === String(id)
              );

            if(item){

              item.read =
                !Boolean(item.read);

              render();
            }

            return;
          }


          if(deleteButton){

            const id =
              deleteButton.dataset.deleteId;

            const confirmed =
              window.confirm(
                "Delete this notification?"
              );

            if(!confirmed){
              return;
            }

            notifications =
              notifications.filter(
                n =>
                  String(
                    n.id ||
                    n.notificationId ||
                    ""
                  ) !== String(id)
              );

            render();
          }

        }
      );


      document
        .querySelectorAll(".filter-tab")
        .forEach(
          button => {

            button.addEventListener(
              "click",
              () => {

                document
                  .querySelectorAll(
                    ".filter-tab"
                  )
                  .forEach(
                    tab =>
                      tab.classList.remove(
                        "active"
                      )
                  );

                button.classList.add(
                  "active"
                );

                currentFilter =
                  button.dataset.filter ||
                  "all";

                render();
              }
            );
          }
        );


      refreshBtn.addEventListener(
        "click",
        loadNotifications
      );


      markAllReadBtn.addEventListener(
        "click",
        markAllRead
      );


      await loadNotifications();

    });

  </script>

</body>
</html>
