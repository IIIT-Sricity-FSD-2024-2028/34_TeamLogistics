name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [backend, front-end-react]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      - run: npm run build
      - if: matrix.project == 'backend'
        run: npm test -- --runInBand && npm run test:e2e -- --runInBand
      - if: matrix.project == 'front-end-react'
        run: npm test
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: backend
      - run: npm ci && npx playwright install --with-deps chromium && npm run test:browser
        working-directory: front-end-react
