<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeliverSync | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="assets/js/data.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/auth.js" defer></script>
</head>
<body>
  <main class="login-shell">
    <section class="showcase">
      <a class="back-link login-back-link" href="roles.html">← Back</a>
      <a class="brand brand-image" href="index.html"><img src="assets/logo.png" alt="DeliverSync Logo"></a>
      <h1>Access<br>Your<br>Operations</h1>
      <p>Log in to manage fleets, track deliveries, and monitor performance in real time.</p>
    </section>
    <section class="auth-panel-wrap">
      <div class="auth-panel">
        <h2>Welcome Back!!</h2>
        <form id="login-form" novalidate>
          <div class="form-grid">
            <div class="form-control">
              <label for="email">Email</label>
              <div class="input-wrap"><input id="email" name="email" type="text" placeholder="abc@gmail.com"></div>
              <div class="error-message"></div>
            </div>
            <div class="form-control">
              <label for="password">Password</label>
              <div class="input-wrap"><input id="password" name="password" type="password" placeholder="••••••••"><button type="button" class="toggle-visibility">👁</button></div>
              <div class="error-message"></div>
            </div>
          </div>
          <div class="form-meta">
            <label class="checkbox-line"><input id="rememberMe" type="checkbox" checked> Remember Me</label>
            <a href="#" onclick="alert('Use the mock credentials shown below for the prototype.');return false;">Forgot Password?</a>
          </div>
          <div class="form-actions"><button class="btn btn-secondary" type="submit" style="min-width:160px;background:#efefef;color:#222;">Login</button></div>
          <div class="form-footer">Don't have an account? <a href="roles.html">Get started</a></div>
          <div id="demo-credentials" style="margin-top:18px;padding:16px;border-radius:14px;background:rgba(0,0,0,0.08);line-height:1.7;"></div>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
