px;font-weight:800">Bank Details</div><label class="form-label">Account Holder Name</label><input class="form-input" placeholder="Enter account holder name"><div class="grid-2"><div><label class="form-label">Account Number</label><input class="form-input" placeholder="Enter account no."></div><div><label class="form-label">IFSC Code</label><input class="form-input" placeholder="Enter IFSC"></div></div><label class="form-label">Bank Name</label><input class="form-input" placeholder="Enter bank name"><label class="form-label">Upload Bank Book</label><div class="upload-box" style="background:linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.06));color:#fff;border:1px solid rgba(255,255,255,0.28);box-shadow:0 10px 24px rgba(0,0,0,0.22)">Choose File</div></div><label class="form-label">Username</label><input class="form-input" placeholder="Enter username"><div class="grid-2"><div><label class="form-label">Password</label><input class="form-input" placeholder="Enter password"></div><div><label class="form-label">Confirm Password</label><input class="form-input" placeholder="Confirm password"></div></div><a href="login.html" class="btn yellow full mt-20">Register as Driver</a><div class="center mt-20" style="color:#666666">Already have an account? <a style="color:var(--yellow);font-weight:700" href="login.html">Sign in</a></div></main></body></html>
