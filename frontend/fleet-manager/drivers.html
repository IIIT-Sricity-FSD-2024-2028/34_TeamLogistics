path></svg></span><span>Documents</span></a><a class="" href="analytics.html"><span class="ico"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 20V9"></path><path d="M10 20V4"></path><path d="M16 20v-7"></path><path d="M22 20V12"></path></svg></span><span>Analytics</span></a><a class="" href="notifications.html"><span class="ico"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M15 17H5l1.3-1.3A2 2 0 0 0 7 14.3V10a5 5 0 1 1 10 0v4.3a2 2 0 0 0 .6 1.4L19 17h-4"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg></span><span>Notifications</span></a><a class="" href="profile.html"><span class="ico"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 20a8 8 0 0 1 16 0"></path></svg></span><span>Profile</span></a><a class="" href="settings.html"><span class="ico"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></span><span>Settings</span></a></nav><a class="logout" href="../login.html"><span class="ico"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg></span><span>Logout</span></a></aside>
<main class="main"><div class="topbar"><div class="pagehead"><h1>Driver Management</h1><p>Manage drivers and monitor performance</p></div><div class="toptools"><label class="search"><span>⌕</span><input placeholder="Search..."/></label><a aria-label="Notifications" class="iconbox iconlink notif-link" href="notifications.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M15 17H5l1.3-1.3A2 2 0 0 0 7 14.3V10a5 5 0 1 1 10 0v4.3a2 2 0 0 0 .6 1.4L19 17h-4"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg><span class="dot">3</span></a><div class="avatar">FM</div><div class="usertext"><strong>Fleet Manager</strong><span>Administrator</span></div></div></div><div class="content">
<div class="toolbar"><div style="display:flex;gap:12px"><label class="search-sm"><span>⌕</span><input placeholder="Search drivers..."/></label><button class="btn btn-ghost btn-small">Filter</button></div><div style="display:flex;gap:12px"><a class="btn btn-ghost" href="compliance.html">Compliance Check</a></div></div>
<section class="panel"><table class="table"><thead><tr><th>Driver</th><th>License Number</th><th>Phone</th><th>Status</th><th>Rating</th><th>Last Trip</th><th>Actions</th></tr></thead><tbody id="driver-body"></tbody></table></section>
</div></main></div>
<script>
const dbody=document.getElementById('driver-body');

function getDriverRows(){
  return (window.FleetManagerData.getDrivers ? window.FleetManagerData.getDrivers() : FleetManagerData.drivers || []).slice();
}

function renderDriverRows(){
  const rows = getDriverRows();
  dbody.innerHTML = rows.map(d=>`<tr data-driver-id="${d.id}"><td><div style='display:flex;align-items:center;gap:14px'><div style='width:40px;height:40px;border-radius:12px;background:var(--yellow);display:grid;place-items:center;color:#111;font-weight:800'>${String(d.name||'D').split(' ').map(x=>x[0]).join('').slice(0,2)}</div><div><div>${d.name}</div><small class='muted'>${d.id}</small></div></div></td><td>${d.license}</td><td>${d.phone}</td><td><span class='pill ${pillClass(d.status)}'>${d.status}</span></td><td class='em'>★ ${d.rating}</td><td>${d.trip}</td><td><div class='actions'><button class='dots'>⋮</button><div class='menu'><a href='driver-profile.html?id=${encodeURIComponent(d.id)}'>View</a><a href='edit-driver.html?id=${encodeURIComponent(d.id)}'>Edit</a>${String(d.status||'').toLowerCase()==='suspended' ? `<button class='unsuspend-driver-btn'>Unsuspend</button>` : `<button class='danger suspend-driver-btn'>Suspend</button>`}<a href='compliance.html?id=${encodeURIComponent(d.id)}'>Compliance</a></div></div></td></tr>`).join('');
  bindMenus();
  applyFilter();
}

function rowMatchesPrefix(row, q){
  if(!q) return true;
  const needle=q.toLowerCase();
  const text=row.innerText || '';
  return text.toLowerCase().split(/[^a-z0-9]+/i).filter(Boolean).some(w=>w.startsWith(needle));
}


function pushDriverStatusNotification(driver, nextStatus){
  if(!driver || !window.FleetManagerData.readCoreState || !window.FleetManagerData.writeCoreState) return;
  const core = window.FleetManagerData.readCoreState() || {};
  if(!Array.isArray(core.users)) return;
  const idx = core.users.findIndex(u => String(u.role||'').toLowerCase()==='driver' && (String(u.id||'')===String(driver.id||'') || (u.email && driver.email && String(u.email).toLowerCase()===String(driver.email).toLowerCase()) || (u.profileDetails && String(u.profileDetails.driverId||'')===String(driver.id||'')) || (u.profileDetails && String(u.profileDetails.licenseNumber||'')===String(driver.license||''))));
  if(idx < 0) return;
  const user = core.users[idx];
  const notifications = Array.isArray(user.notifications) ? user.notifications.slice() : [];
  notifications.unshift({
    id: `DRV-NOTIF-${Date.now()}`,
    title: nextStatus === 'Suspended' ? 'Account Suspended' : 'Account Activated',
    message: nextStatus === 'Suspended' ? 'Your driver account has been suspended by Fleet Manager.' : 'Your driver account has been unsuspended and set to Active by Fleet Manager.',
    time: 'Just now',
    createdAt: new Date().toISOString()
  });
  core.users[idx] = { ...user, status: nextStatus, notifications };
  window.FleetManagerData.writeCoreState(core);
}

function updateDriverStatus(id, nextStatus){
  const current = getDriverRows().find(d => String(d.id)===String(id));
  if(!current) return;
  if(window.FleetManagerData.syncDriverToCore){
    window.FleetManagerData.syncDriverToCore({ ...current, status: nextStatus });
  }
  pushDriverStatusNotification(current, nextStatus);
  renderDriverRows();
}

const searchInput=document.querySelector('.search-sm input');
function applyFilter(){
  const q=(searchInput?.value||'').trim();
  Array.from(dbody.querySelectorAll('tr')).forEach(r=>{
    r.style.display = rowMatchesPrefix(r,q) ? '' : 'none';
  });
}
if(searchInput){ searchInput.addEventListener('input', applyFilter); }

function bindMenus(){
  const menus = document.querySelectorAll('.actions');
  menus.forEach(w=>{
    const b=w.querySelector('.dots'), m=w.querySelector('.menu');
    if(!b||!m) return;
    b.addEventListener('click',(e)=>{
      e.preventDefault();
      document.querySelectorAll('.actions .menu').forEach(x=>x!==m&&x.classList.remove('show'));
      m.classList.toggle('show');
      e.stopPropagation();
    });
  });
  document.querySelectorAll('.suspend-driver-btn').forEach(btn=>btn.addEventListener('click',(e)=>{
    e.preventDefault();
    const row = btn.closest('tr');
    if(!row) return;
    updateDriverStatus(row.getAttribute('data-driver-id'), 'Suspended');
  }));
  document.querySelectorAll('.unsuspend-driver-btn').forEach(btn=>btn.addEventListener('click',(e)=>{
    e.preventDefault();
    const row = btn.closest('tr');
    if(!row) return;
    updateDriverStatus(row.getAttribute('data-driver-id'), 'Active');
  }));
}

document.addEventListener('click',()=>document.querySelectorAll('.actions .menu').forEach(m=>m.classList.remove('show')));
renderDriverRows();
</script>
</body></html>
